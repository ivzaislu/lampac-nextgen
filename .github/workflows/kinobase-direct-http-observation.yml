name: Kinobase direct HTTP observation
on:
  push:
    branches: [cinemar]
    paths:
      - '.github/scripts/kinobase-embed-selfcheck.cs'
      - '.github/workflows/kinobase-direct-http-observation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Pin installed .NET 10 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(dotnet --list-sdks | awk '$1 ~ /^10\.0\.[0-9]+$/ {print $1}' | sort -V | tail -n 1)"
          test -n "$sdk"
          test ! -e global.json
          printf '{"sdk":{"version":"%s","rollForward":"disable","allowPrerelease":false}}\n' "$sdk" > global.json
          dotnet --version
          test "$(dotnet --version)" = "$sdk"
      - name: Observe direct public HTML with native Embed
        run: dotnet run --configuration Release --file .github/scripts/kinobase-embed-selfcheck.cs -- --observe-direct
