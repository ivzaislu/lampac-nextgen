name: TranslationSub SubscriptionStore tests

on:
  push:
    branches:
      - TranslationSub-release
    paths:
      - 'Modules/TranslationSub/Services/SubscriptionStore.cs'
      - 'Modules/TranslationSub/Models/TranslationSubscription.cs'
      - 'scripts/ci/TranslationSub.StoreTests/**'
      - '.github/workflows/translationsub-store-tests.yml'
  pull_request:
    paths:
      - 'Modules/TranslationSub/Services/SubscriptionStore.cs'
      - 'Modules/TranslationSub/Models/TranslationSubscription.cs'
      - 'scripts/ci/TranslationSub.StoreTests/**'
      - '.github/workflows/translationsub-store-tests.yml'
  workflow_dispatch:

jobs:
  subscription-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run SubscriptionStore regression tests
        run: dotnet run --project scripts/ci/TranslationSub.StoreTests/TranslationSub.StoreTests.csproj --configuration Release
