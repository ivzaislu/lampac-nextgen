name: VkSeries final identity verification

on:
  push:
    branches:
      - vkseries-global-clean-20260925
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}
      - name: Build
        run: dotnet build Modules/OnlineRUS/VkSeries/VkSeries.csproj --configuration Release --verbosity minimal
      - name: Verify identity and parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/VkSeriesFinalVerify
          cat >.tmp/VkSeriesFinalVerify/Test.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <OutputType>Exe</OutputType>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../Modules/OnlineRUS/VkSeries/VkSeries.csproj" />
            </ItemGroup>
          </Project>
          EOF

          cat >.tmp/VkSeriesFinalVerify/Program.cs <<'EOF'
          using System.Reflection;
          using VkSeries;

          var t=typeof(VkSeriesController);
          var group=t.GetMethod("GroupIdentityScore",BindingFlags.Static|BindingFlags.NonPublic)!;
          var parse=t.GetMethod("ParseVideos",BindingFlags.Static|BindingFlags.NonPublic)!;

          int GS(string groupName,string title)=>(int)(group.Invoke(null,new object?[]{groupName,title,""})??0);

          void Eq(string name,int actual,int expected)
          {
              if(actual!=expected) throw new Exception($"{name}: expected {expected}, got {actual}");
              Console.WriteLine($"PASS {name}: {actual}");
          }

          void Positive(string name,int actual)
          {
              if(actual<=0) throw new Exception($"{name}: expected positive, got {actual}");
              Console.WriteLine($"PASS {name}: {actual}");
          }

          Positive("exact group",GS("Физрук","Физрук"));
          Positive("structural group",GS("Физрук сериал","Физрук"));
          Eq("spinoff rejected",GS("Универ Новая общага","Универ"),0);
          Eq("lookalike rejected",GS("Кухня Вайта","Кухня"),0);
          Eq("other suffix rejected",GS("Триггер дорама","Триггер"),0);

          var v=new Video{
              owner_id=-1,id=1,
              title="Отель Элеон - 21 серия 2 сезон (42 серия)",
              duration=1500,
              files=new VideoFiles{mp4_720="https://example.invalid/a.mp4"}
          };

          var rows=(System.Collections.IEnumerable?)parse.Invoke(null,new object?[]{new[]{v},(short)2})
              ?? Array.Empty<object>();
          foreach(var item in rows)
          {
              if(item is null) continue;
              var it=item.GetType();
              var season=(short)(it.GetProperty("season")?.GetValue(item)??(short)0);
              var episode=(short)(it.GetProperty("episode")?.GetValue(item)??(short)0);
              if(season!=2 || episode!=21)
                  throw new Exception($"episode-before-season: got S{season}E{episode}");
              Console.WriteLine($"PASS episode-before-season: S{season}E{episode}");
              return;
          }

          throw new Exception("episode-before-season: no parsed episode");
          EOF

          dotnet run --project .tmp/VkSeriesFinalVerify/Test.csproj --configuration Release
