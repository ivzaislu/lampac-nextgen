name: VkSeries ranking lite

on:
  push:
    branches:
      - vkseries-global-clean-20260925
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}
      - name: Run ranking audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/VkSeriesRankingLite

          cat >.tmp/VkSeriesRankingLite/Audit.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <OutputType>Exe</OutputType>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../Modules/OnlineRUS/VkSeries/VkSeries.csproj" />
            </ItemGroup>
          </Project>
          EOF

          cat >.tmp/VkSeriesRankingLite/Program.cs <<'EOF'
          using System.Reflection;
          using System.Text.Json;
          using VkSeries;
          using Shared.Services.Utilities;

          var shows = new (string title, string original, short year, int expectedMax)[]
          {
              ("Симпсоны", "The Simpsons", 1989, 37),
              ("Южный парк", "South Park", 1997, 28),
              ("Кухня", "Kitchen", 2012, 6),
              ("Триггер", "Trigger", 2020, 3),
              ("Слово пацана", "The Boy's Word. Blood on the Asphalt", 2023, 1)
          };

          using var http = new HttpClient { Timeout = TimeSpan.FromSeconds(30) };
          const int clientId = 52461373;
          const string api = "https://api.vkvideo.ru/method";
          const string v = "5.264";

          var authJson = await Post($"{api}/auth.getAnonymToken?v={v}&client_id={clientId}", new());
          using var authDoc = JsonDocument.Parse(authJson);
          var token = authDoc.RootElement.GetProperty("response").GetProperty("token").GetString()!;

          var t = typeof(VkSeriesController);
          var albumScoreM = t.GetMethod("AlbumScore", BindingFlags.Static|BindingFlags.NonPublic)!;
          var videoScoreM = t.GetMethod("SeriesVideoScore", BindingFlags.Static|BindingFlags.NonPublic)!;
          var parseSeasonM = t.GetMethod("ParseSeason", BindingFlags.Static|BindingFlags.NonPublic)!;
          string Norm(string? x) => SearchNameTo.Convert(x) ?? "";
          int AlbumScore(VideoAlbum a,string st,string so,short year) =>
              (int)(albumScoreM.Invoke(null,new object?[]{a,st,so,year}) ?? 0);
          int VideoScore(Video x,string st,string so,short year) =>
              (int)(videoScoreM.Invoke(null,new object?[]{x,st,so,year}) ?? 0);
          int ParseSeason(string? x) => (int)(parseSeasonM.Invoke(null,new object?[]{x}) ?? 0);

          foreach (var show in shows)
          {
              var st=Norm(show.title); var so=Norm(show.original);
              Console.WriteLine($"===== {show.title} =====");

              var seeds = new List<VideoAlbum>();
              var vids = new List<Video>();
              foreach (var q in new[]{show.title, $"{show.title} {show.year}", $"{show.title} сезон", show.original, $"{show.original} {show.year}", $"{show.original} season"}.Distinct())
              {
                  var root=await Search(q);
                  if(root?.response?.albums!=null) seeds.AddRange(root.response.albums);
                  if(root?.response?.catalog_videos!=null) vids.AddRange(root.response.catalog_videos.Where(x=>x?.video!=null).Select(x=>x.video));
              }
              seeds=seeds.Where(x=>x!=null&&x.id>0&&x.owner_id!=0).GroupBy(x=>$"{x.owner_id}:{x.id}").Select(g=>g.First()).ToList();

              var scoredSeeds=seeds.Select(a=>new{a,score=AlbumScore(a,st,so,show.year),season=ParseSeason(a.title)})
                  .OrderByDescending(x=>x.score).ThenByDescending(x=>x.a.count).ToList();

              Console.WriteLine("SEEDS");
              foreach(var x in scoredSeeds.Take(25))
                  Console.WriteLine(JsonSerializer.Serialize(new{kind="album",x.score,x.season,x.a.owner_id,x.a.id,x.a.title,x.a.count}));

              var topOwners=scoredSeeds.Where(x=>x.score>0)
                  .GroupBy(x=>x.a.owner_id)
                  .Select(g=>new{owner=g.Key,score=g.Max(x=>x.score)})
                  .OrderByDescending(x=>x.score).Take(3).ToList();

              var all=new List<VideoAlbum>(seeds);
              foreach(var o in topOwners) all.AddRange(await Albums(o.owner));
              all=all.Where(x=>x!=null&&x.id>0&&x.owner_id!=0).GroupBy(x=>$"{x.owner_id}:{x.id}").Select(g=>g.First()).ToList();

              var perSeason=all.Select(a=>new{a,score=AlbumScore(a,st,so,show.year),season=ParseSeason(a.title)})
                  .Where(x=>x.score>0&&x.season>0)
                  .GroupBy(x=>x.season).OrderBy(g=>g.Key).ToList();

              Console.WriteLine("SEASONS");
              foreach(var g in perSeason)
              {
                  var top=g.OrderByDescending(x=>x.score).ThenByDescending(x=>x.a.count).Take(4).ToList();
                  Console.WriteLine(JsonSerializer.Serialize(new{
                      season=g.Key, duplicates=g.Count(),
                      top=top.Select(x=>new{x.score,x.a.owner_id,x.a.id,x.a.title,x.a.count})
                  }));
              }

              var found=perSeason.Select(g=>g.Key).ToHashSet();
              var missing=Enumerable.Range(1,show.expectedMax).Where(x=>!found.Contains(x)).ToArray();
              Console.WriteLine(JsonSerializer.Serialize(new{kind="missing",expectedMax=show.expectedMax,missing}));

              Console.WriteLine("VIDEOS");
              foreach(var x in vids.Where(x=>x!=null).GroupBy(x=>$"{x.owner_id}:{x.id}").Select(g=>g.First())
                  .Select(vv=>new{v=vv,score=VideoScore(vv,st,so,show.year),season=ParseSeason($"{vv.title} {vv.description}")})
                  .OrderByDescending(x=>x.score).ThenByDescending(x=>x.v.duration).Take(30))
              {
                  Console.WriteLine(JsonSerializer.Serialize(new{kind="video",x.score,x.season,x.v.owner_id,x.v.id,x.v.title,x.v.duration,has_files=x.v.files!=null}));
              }
          }

          Console.WriteLine("===== TARGETED_GAPS =====");
          var targets = new (string title, string original, short year, short season)[]
          {
              ("Симпсоны","The Simpsons",1989,3),
              ("Симпсоны","The Simpsons",1989,9),
              ("Симпсоны","The Simpsons",1989,24),
              ("Симпсоны","The Simpsons",1989,28),
              ("Симпсоны","The Simpsons",1989,36),
              ("Симпсоны","The Simpsons",1989,37),
              ("Южный парк","South Park",1997,5),
              ("Южный парк","South Park",1997,14),
              ("Южный парк","South Park",1997,20),
              ("Южный парк","South Park",1997,21),
              ("Южный парк","South Park",1997,28),
              ("Триггер","Trigger",2020,2),
              ("Триггер","Trigger",2020,3),
              ("Слово пацана","The Boy's Word. Blood on the Asphalt",2023,1)
          };

          foreach (var tg in targets)
          {
              var st=Norm(tg.title); var so=Norm(tg.original);
              var albums=new List<VideoAlbum>();
              var videos=new List<Video>();
              foreach(var q in new[]{
                  $"{tg.title} {tg.season} сезон",
                  $"{tg.title} сезон {tg.season}",
                  $"{tg.title} {tg.year} {tg.season} сезон",
                  $"{tg.original} {tg.season} season",
                  $"{tg.original} season {tg.season}"
              }.Distinct())
              {
                  var root=await Search(q);
                  if(root?.response?.albums!=null) albums.AddRange(root.response.albums);
                  if(root?.response?.catalog_videos!=null) videos.AddRange(root.response.catalog_videos.Where(x=>x?.video!=null).Select(x=>x.video));
              }

              var scored=albums.Where(x=>x!=null&&x.id>0&&x.owner_id!=0)
                  .GroupBy(x=>$"{x.owner_id}:{x.id}").Select(g=>g.First())
                  .Select(a=>new{a,score=AlbumScore(a,st,so,tg.year),season=ParseSeason(a.title)})
                  .OrderByDescending(x=>x.score).ThenByDescending(x=>x.a.count).Take(12).ToList();

              var vscored=videos.Where(x=>x!=null)
                  .GroupBy(x=>$"{x.owner_id}:{x.id}").Select(g=>g.First())
                  .Select(vv=>new{v=vv,score=VideoScore(vv,st,so,tg.year),season=ParseSeason($"{vv.title} {vv.description}")})
                  .OrderByDescending(x=>x.score).ThenByDescending(x=>x.v.duration).Take(10).ToList();

              Console.WriteLine(JsonSerializer.Serialize(new{
                  kind="target",
                  tg.title,tg.season,
                  albums=scored.Select(x=>new{x.score,x.season,x.a.owner_id,x.a.id,x.a.title,x.a.count}),
                  videos=vscored.Select(x=>new{x.score,x.season,x.v.title,x.v.duration,has_files=x.v.files!=null})
              }));
          }

          async Task<Root?> Search(string q)
          {
              var json=await Post($"{api}/catalog.getVideoSearchWeb2?v={v}&client_id={clientId}",new(){
                  ["access_token"]=token,["screen_ref"]="search_video_service",["input_method"]="keyboard_search_button",["extended"]="1",["count"]="50",["q"]=q
              });
              return JsonSerializer.Deserialize<Root>(json,new JsonSerializerOptions{PropertyNameCaseInsensitive=true});
          }

          async Task<List<VideoAlbum>> Albums(long owner)
          {
              var result=new List<VideoAlbum>();
              for(int offset=0;offset<500;offset+=100)
              {
                  var json=await Post($"{api}/video.getAlbums?v={v}&client_id={clientId}",new(){
                      ["access_token"]=token,["owner_id"]=owner.ToString(),["count"]="100",["offset"]=offset.ToString(),["extended"]="1",["need_system"]="0"
                  });
                  var root=JsonSerializer.Deserialize<VideoAlbumsRoot>(json,new JsonSerializerOptions{PropertyNameCaseInsensitive=true});
                  if(root?.response?.items==null||root.response.items.Count==0)break;
                  result.AddRange(root.response.items);
                  if(result.Count>=root.response.count||root.response.items.Count<100)break;
              }
              return result;
          }

          async Task<string> Post(string url, Dictionary<string,string> form)
          {
              using var res=await http.PostAsync(url,new FormUrlEncodedContent(form));
              return await res.Content.ReadAsStringAsync();
          }
          EOF

          dotnet run --project .tmp/VkSeriesRankingLite/Audit.csproj --configuration Release
