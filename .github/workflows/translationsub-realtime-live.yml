name: TranslationSub Realtime Live Smoke

on:
  push:
    branches:
      - TranslationSub-final
      - TranslationSub-backend-first-refactor-work
    paths:
      - 'Modules/TranslationSub/ModInit.cs'
      - 'Modules/TranslationSub/V2Controller.cs'
      - 'Modules/TranslationSub/Services/TranslationSubDatabase.cs'
      - 'Modules/TranslationSub/Services/SubscriptionStore.cs'
      - 'Modules/TranslationSub/Services/TranslationSubscriptionService.cs'
      - 'Modules/TranslationSub/Services/TranslationSubRealtimeService.cs'
      - 'Modules/TranslationSub/Services/TimeCodeProgressService.cs'
      - 'Modules/TranslationSub/Services/ProfileProgressStore.cs'
      - 'Modules/TranslationSub/Models/TranslationSubscription.cs'
      - 'Modules/TranslationSub/Models/SubscriptionProfileProgress.cs'
      - 'Modules/Sync/TimeCode/**'
      - 'scripts/ci/translationsub-realtime-live.mjs'
      - '.github/workflows/translationsub-realtime-live.yml'
  workflow_dispatch:

concurrency:
  group: translationsub-realtime-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  realtime-live:
    name: Live NWS + SQLite batching + TimeCode smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish Lampac runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lampac-runtime
          dotnet publish Core/Core.csproj \
            --configuration Release \
            --output /tmp/lampac-runtime \
            --verbosity minimal \
            -p:PlaywrightPlatform=linux-x64

          test -f /tmp/lampac-runtime/Core.dll
          test -f /tmp/lampac-runtime/module/TranslationSub/manifest.json
          test -f /tmp/lampac-runtime/module/Sync/TimeCode/manifest.json

          cat > /tmp/lampac-runtime/init.yaml <<'YAML'
          chromium:
            enable: false
          firefox:
            enable: false
          rch:
            enable: false
          cache:
            type: mem
          accsdb:
            enable: true
            accounts:
              ci@translationsub.test: '2099-01-01T00:00:00'
          BaseModule:
            nws: true
            LoadModules:
              - TranslationSub
              - TimeCode
          listen:
            port: 9118
          YAML

      - name: Start Lampac and wait for TranslationSub v2
        shell: bash
        run: |
          set -euo pipefail
          (
            cd /tmp/lampac-runtime
            dotnet Core.dll > /tmp/lampac-realtime.log 2>&1
          ) &
          echo $! > /tmp/lampac-realtime.pid

          ready=0
          for i in $(seq 1 120); do
            if curl --silent --show-error --fail --max-time 2 \
              'http://127.0.0.1:9118/translationsub/v2/settings?uid=ci%40translationsub.test' \
              -o /tmp/realtime-settings.json; then
              if python3 - <<'PY'
          import json
          try:
              data = json.load(open('/tmp/realtime-settings.json', encoding='utf-8'))
              raise SystemExit(0 if data.get('success') is True and isinstance(data.get('settings'), dict) else 1)
          except Exception:
              raise SystemExit(1)
          PY
              then
                ready=1
                break
              fi
            fi

            if ! kill -0 "$(cat /tmp/lampac-realtime.pid)" 2>/dev/null; then
              echo 'Lampac exited before TranslationSub v2 became ready'
              tail -n 400 /tmp/lampac-realtime.log || true
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != '1' ]; then
            echo 'TranslationSub v2 did not become ready'
            cat /tmp/realtime-settings.json 2>/dev/null || true
            tail -n 400 /tmp/lampac-realtime.log || true
            exit 1
          fi

      - name: Seed TranslationSub SQLite subscription
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3

          path = '/tmp/lampac-runtime/database/translationsub.db'
          db = sqlite3.connect(path, timeout=10)
          db.execute(
              '''
              INSERT OR REPLACE INTO subscriptions (
                  id, uid, content_id, title, original_title, is_serial, source,
                  translation_id, translation_name, current_season, last_season,
                  last_episode, sources_json, created_at, tmdb_new_season_available
              ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
              ''',
              (
                  'ci-subscription', 'ci@translationsub.test', 'ci-series',
                  'CI Series', 'CI Series', 1, 'multi', 'ci-voice', 'CI Voice',
                  1, 1, 3, '[]', '2026-01-01T00:00:00.0000000', 0
              )
          )
          db.commit()
          row = db.execute(
              'SELECT id, uid, last_episode FROM subscriptions WHERE id = ?',
              ('ci-subscription',)
          ).fetchone()
          db.close()
          assert row == ('ci-subscription', 'ci@translationsub.test', 3), row
          print('Seeded TranslationSub SQLite subscription')
          PY

      - name: Run backend-first live realtime smoke
        env:
          LAMPAC_BASE: http://127.0.0.1:9118
          TRANSLATIONSUB_STORE: /tmp/lampac-runtime/database/translationsub.db
        run: node scripts/ci/translationsub-realtime-live.mjs

      - name: Runtime log tail
        if: always()
        shell: bash
        run: |
          echo '===== lampac realtime log tail ====='
          tail -n 400 /tmp/lampac-realtime.log 2>/dev/null || true

      - name: Stop Lampac
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/lampac-realtime.pid ]; then
            kill "$(cat /tmp/lampac-realtime.pid)" 2>/dev/null || true
          fi
