name: TranslationSub Backend-First CI

on:
  push:
    branches:
      - TranslationSub-clean-legacy-api
      - TranslationSub-backend-first-refactor
      - TranslationSub-backend-first-refactor-work
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translationsub-backend-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Backend-first architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check TranslationSub JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find Modules/TranslationSub -maxdepth 1 -type f -name 'translationsub*.js' -print0 | sort -z)

      - name: Verify dynamic module manifest is complete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          module = Path('Modules/TranslationSub')
          manifest = json.loads((module / 'manifest.json').read_text(encoding='utf-8'))
          declared = set(manifest.get('tree') or [])
          actual = {
              path.relative_to(module).as_posix()
              for path in module.rglob('*.cs')
              if 'bin' not in path.parts and 'obj' not in path.parts
          }
          missing = sorted(actual - declared)
          stale = sorted(path for path in declared if path.endswith('.cs') and not (module / path).is_file())
          assert not missing, f'C# files missing from TranslationSub manifest.tree: {missing}'
          assert not stale, f'Stale C# files in TranslationSub manifest.tree: {stale}'
          print(f'TranslationSub manifest covers {len(actual)} C# files')
          PY

      - name: Audit repository-wide TimeCode writers
        run: node scripts/ci/translationsub-timecode-writer-audit.mjs

      - name: Enforce backend-first ownership
        run: node scripts/ci/translationsub-backend-driven-simulation.mjs

      - name: Enforce event-driven refresh ownership
        run: node scripts/ci/translationsub-background-refresh-simulation.mjs

      - name: Enforce thin-client JavaScript rules
        run: node scripts/ci/translationsub-js-audit.mjs

      - name: Assert canonical v2 client contract
        shell: bash
        run: |
          set -euo pipefail
          api='Modules/TranslationSub/translationsub-api.js'
          for route in \
            '/translationsub/v2/snapshot' \
            '/translationsub/v2/content-state' \
            '/translationsub/v2/subscriptions' \
            '/translationsub/v2/check' \
            '/translationsub/v2/settings'; do
            grep -Fq "$route" "$api"
          done

          if grep -Eq "request\('(PUT|DELETE)'" "$api"; then
            echo 'Thin TranslationSub client uses unsupported dynamic-module HTTP verbs'
            exit 1
          fi
          grep -Fq "'/translationsub/v2/subscriptions/' + id + '/remove'" "$api"

      - name: Assert legacy HTTP surface stays removed
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Modules/TranslationSub/Controller.cs
          test ! -e Modules/TranslationSub/translationsub-watch.js

          if grep -RniE --include='*.cs' \
            '\[Route\("(transsubscribe/|translationsub/(list|updates|progress|variants|check|add|remove|user-settings|sources|toggle|watched|notified)("|/))' \
            Modules/TranslationSub; then
            echo 'Legacy TranslationSub route returned'
            exit 1
          fi

          if grep -RniE --include='translationsub*.js' \
            '/(transsubscribe|translationsub/(list|updates|progress|variants|check|add|remove|user-settings|sources))' \
            Modules/TranslationSub; then
            echo 'Frontend references a legacy TranslationSub route'
            exit 1
          fi

  server-smoke:
    name: Build + v2 runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}

      - name: Restore
        run: dotnet restore --verbosity minimal NextGen.slnx

      - name: Build Release
        run: dotnet build NextGen.slnx --configuration Release --no-restore --verbosity minimal

      - name: Publish Lampac runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lampac-runtime
          dotnet publish Core/Core.csproj \
            --configuration Release \
            --output /tmp/lampac-runtime \
            --verbosity minimal \
            -p:PlaywrightPlatform=linux-x64

          test -f /tmp/lampac-runtime/Core.dll
          test -f /tmp/lampac-runtime/module/TranslationSub/manifest.json
          test -d /tmp/lampac-runtime/runtimes/references

          cat > /tmp/lampac-runtime/init.yaml <<'YAML'
          chromium:
            enable: false
          firefox:
            enable: false
          rch:
            enable: false
          cache:
            type: mem
          accsdb:
            enable: true
            accounts:
              ci@translationsub.test: '2099-01-01T00:00:00'
          BaseModule:
            LoadModules:
              - TranslationSub
              - FlixCDN
              - Phantom
              - ZetflixDB
              - VideoDB
              - CDNvideohub
          listen:
            port: 9118
          YAML

      - name: Start Lampac and wait for TranslationSub
        shell: bash
        run: |
          set -euo pipefail
          (
            cd /tmp/lampac-runtime
            dotnet Core.dll > /tmp/lampac.log 2>&1
          ) &
          echo $! > /tmp/lampac.pid

          ready=0
          for i in $(seq 1 120); do
            if curl --silent --show-error --fail --max-time 2 \
              'http://127.0.0.1:9118/translationsub/v2/settings?uid=ci%40translationsub.test' \
              -o /tmp/settings.json; then
              ready=1
              break
            fi

            if ! kill -0 "$(cat /tmp/lampac.pid)" 2>/dev/null; then
              echo 'Lampac exited before TranslationSub became ready'
              tail -n 400 /tmp/lampac.log || true
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != '1' ]; then
            echo 'TranslationSub did not become ready'
            tail -n 400 /tmp/lampac.log || true
            exit 1
          fi

      - name: Validate backend-first v2 contracts
        shell: bash
        run: |
          set -euo pipefail
          base='http://127.0.0.1:9118'
          uid='ci%40translationsub.test'

          curl --silent --show-error --fail --max-time 10 \
            -H 'Content-Type: application/json' \
            -X POST \
            --data '{"checkIntervalHours":1,"sources":[],"useTmdbSchedule":true,"tmdbRefreshHours":24,"endedRefreshDays":7,"newSeasonMode":"auto"}' \
            "$base/translationsub/v2/settings?uid=$uid" \
            -o /tmp/settings-post.json

          curl --silent --show-error --fail --max-time 10 \
            "$base/translationsub/v2/snapshot?uid=$uid&profile_id=7" \
            -o /tmp/snapshot.json

          curl --silent --show-error --fail --max-time 20 \
            -H 'Content-Type: application/json' \
            -X POST --data '{}' \
            "$base/translationsub/v2/check?uid=$uid&profile_id=7" \
            -o /tmp/check.json

          curl --silent --show-error --fail --max-time 10 \
            -H 'Content-Type: application/json' \
            -X POST \
            --data '{"card":{"id":123,"source":"tmdb","media_type":"movie","title":"CI Movie"}}' \
            "$base/translationsub/v2/content-state?uid=$uid&profile_id=7" \
            -o /tmp/content-state.json

          curl --silent --show-error --fail --max-time 10 \
            -H 'Content-Type: application/json' \
            -X POST \
            --data '{"card":{"id":123,"source":"tmdb","media_type":"movie","title":"CI Movie"},"voiceId":"ci"}' \
            "$base/translationsub/v2/subscriptions?uid=$uid&profile_id=7" \
            -o /tmp/subscribe.json

          curl --silent --show-error --fail --max-time 10 \
            -H 'Content-Type: application/json' \
            -X POST --data '{}' \
            "$base/translationsub/v2/subscriptions/missing/remove?uid=$uid&profile_id=7" \
            -o /tmp/unsubscribe.json

          python3 - <<'PY'
          import json

          settings = json.load(open('/tmp/settings-post.json', encoding='utf-8'))
          assert settings.get('success') is True, settings
          canonical = settings.get('settings') or {}
          assert canonical.get('Sources', canonical.get('sources')) == [], settings

          snapshot = json.load(open('/tmp/snapshot.json', encoding='utf-8'))
          assert snapshot.get('ProfileId', snapshot.get('profileId')) == '7', snapshot
          assert isinstance(snapshot.get('Badge', snapshot.get('badge')), dict), snapshot
          assert isinstance(snapshot.get('Subscriptions', snapshot.get('subscriptions')), list), snapshot
          assert isinstance(snapshot.get('Updates', snapshot.get('updates')), list), snapshot

          check = json.load(open('/tmp/check.json', encoding='utf-8'))
          assert check.get('success') is True and isinstance(check.get('snapshot'), dict), check

          content = json.load(open('/tmp/content-state.json', encoding='utf-8'))
          assert content.get('eligible') is False and content.get('reason') == 'not_serial', content

          subscribe = json.load(open('/tmp/subscribe.json', encoding='utf-8'))
          assert subscribe.get('success') is False and subscribe.get('error') == 'not_serial', subscribe

          unsubscribe = json.load(open('/tmp/unsubscribe.json', encoding='utf-8'))
          assert unsubscribe.get('success') is False and unsubscribe.get('error') == 'subscription_not_found', unsubscribe
          print('TranslationSub canonical v2 runtime smoke passed')
          PY

      - name: Verify legacy APIs are not served
        shell: bash
        run: |
          set -euo pipefail
          base='http://127.0.0.1:9118'

          check_removed() {
            local method="$1"
            local path="$2"
            local key
            key=$(echo "$path" | tr '/?' '__')
            local body="/tmp/legacy-${key}.body"
            local status
            status=$(curl --silent --show-error --max-time 10 \
              -o "$body" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -X "$method" \
              --data '{}' \
              "$base$path")

            if [ "$status" = '404' ]; then return 0; fi
            if [ "$status" != '200' ]; then
              echo "$method $path returned unexpected HTTP $status"
              return 1
            fi

            BODY="$body" PATH_UNDER_TEST="$path" python3 - <<'PY'
          import json, os
          path = os.environ['PATH_UNDER_TEST']
          try:
              data = json.load(open(os.environ['BODY'], encoding='utf-8'))
          except Exception as exc:
              raise AssertionError(f'{path} returned HTTP 200 non-JSON body: {exc}')
          assert isinstance(data, dict) and data.get('accsdb') is True and 'success' not in data, (path, data)
          PY
          }

          for prefix in translationsub transsubscribe; do
            for route in list updates progress variants check user-settings sources; do
              check_removed GET "/$prefix/$route"
            done
            for route in add remove toggle watched notified; do
              check_removed POST "/$prefix/$route"
            done
          done

      - name: Runtime log tail
        if: always()
        shell: bash
        run: |
          echo '===== lampac.log tail ====='
          tail -n 400 /tmp/lampac.log 2>/dev/null || true

      - name: Stop Lampac
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/lampac.pid ]; then
            kill "$(cat /tmp/lampac.pid)" 2>/dev/null || true
          fi
