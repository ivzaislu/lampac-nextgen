name: VkSeries targeted album audit

on:
  push:
    branches:
      - vkseries-global-clean-20260925
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}
      - name: Audit production-like season discovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/VkSeriesAlbumAudit

          cat >.tmp/VkSeriesAlbumAudit/Audit.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <OutputType>Exe</OutputType>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../Modules/OnlineRUS/VkSeries/VkSeries.csproj" />
            </ItemGroup>
          </Project>
          EOF

          cat >.tmp/VkSeriesAlbumAudit/Program.cs <<'EOF'
          using System.Collections;
          using System.Reflection;
          using System.Text.Json;
          using Shared.Services.Utilities;
          using VkSeries;

          var shows=new (string title,short year)[]{
              ("Интерны",2010),("Универ",2008),("Воронины",2009),("Молодёжка",2013),
              ("Физрук",2014),("Полицейский с Рублёвки",2016),("Ивановы-Ивановы",2017),
              ("Отель Элеон",2016),("Реальные пацаны",2010),("Папины дочки",2007)
          };

          var t=typeof(VkSeriesController);
          var albumScoreM=t.GetMethod("AlbumScore",BindingFlags.Static|BindingFlags.NonPublic)!;
          var videoScoreM=t.GetMethod("SeriesVideoScore",BindingFlags.Static|BindingFlags.NonPublic)!;
          var parseSeasonM=t.GetMethod("ParseSeason",BindingFlags.Static|BindingFlags.NonPublic)!;
          var parseVideosM=t.GetMethod("ParseVideos",BindingFlags.Static|BindingFlags.NonPublic)!;
          var queriesM=t.GetMethod("BuildSearchQueries",BindingFlags.Static|BindingFlags.NonPublic)!;
          var multiM=t.GetMethod("IsMultiSeasonAlbumTitle",BindingFlags.Static|BindingFlags.NonPublic)!;

          int AlbumScore(VideoAlbum a,string st,short year)=>(int)(albumScoreM.Invoke(null,new object?[]{a,st,"",year})??0);
          int VideoScore(Video v,string st,short year)=>(int)(videoScoreM.Invoke(null,new object?[]{v,st,"",year})??0);
          short Season(string? x)=>(short)(int)(parseSeasonM.Invoke(null,new object?[]{x})??0);
          bool Multi(string? x)=>(bool)(multiM.Invoke(null,new object?[]{x})??false);

          List<(short season,short episode,Video video)> Parse(IEnumerable<Video> videos,short hint)
          {
              var e=(IEnumerable?)parseVideosM.Invoke(null,new object?[]{videos,hint})??Array.Empty<object>();
              var r=new List<(short,short,Video)>();
              foreach(var item in e)
              {
                  if(item is null)continue;
                  var it=item.GetType();
                  var s=(short)(it.GetProperty("season")?.GetValue(item)??(short)0);
                  var ep=(short)(it.GetProperty("episode")?.GetValue(item)??(short)0);
                  var v=(Video?)it.GetProperty("video")?.GetValue(item);
                  if(v!=null)r.Add((s,ep,v));
              }
              return r;
          }

          bool Confident(IEnumerable<(short season,short episode,Video video)> rows,int minEpisodes,int minMedianSeconds)
          {
              var u=rows.Where(x=>x.episode>0)
                  .GroupBy(x=>x.episode)
                  .Select(g=>g.OrderByDescending(x=>x.video.duration).First())
                  .OrderBy(x=>x.episode)
                  .ToList();

              if(u.Count<minEpisodes)return false;

              int first=u.First().episode;
              int last=u.Last().episode;
              int span=last-first+1;

              if(u.Count<8 && first>3)return false;
              if(span>u.Count*2)return false;

              var d=u.Where(x=>x.video.duration>0)
                  .Select(x=>x.video.duration)
                  .OrderBy(x=>x)
                  .ToList();

              return d.Count>=minEpisodes && d[d.Count/2]>=minMedianSeconds;
          }

          bool Noise(Video v)
          {
              string z=((v.title??"")+" "+(v.description??"")).ToLowerInvariant();
              return z.Contains("трейлер")||z.Contains("тизер")||z.Contains("анонс")||
                     z.Contains("trailer")||z.Contains("teaser")||z.Contains("promo")||
                     z.Contains("preview")||z.Contains("нарезк")||z.Contains("подборк");
          }

          using var http=new HttpClient{Timeout=TimeSpan.FromSeconds(30)};
          const int clientId=52461373;
          const string api="https://api.vkvideo.ru/method";
          const string ver="5.264";

          using var auth=JsonDocument.Parse(await Post($"{api}/auth.getAnonymToken?v={ver}&client_id={clientId}",new()));
          string token=auth.RootElement.GetProperty("response").GetProperty("token").GetString()!;

          var ownerAlbumCache=new Dictionary<long,List<VideoAlbum>>();

          foreach(var show in shows)
          {
              string st=SearchNameTo.Convert(show.title)??"";
              var found=new List<object>();

              for(short target=1;target<=4;target++)
              {
                  var albums=new List<VideoAlbum>();
                  var videos=new List<Video>();

                  var albumQueries=(IEnumerable<string>?)queriesM.Invoke(
                      null,new object?[]{show.title,"",show.year,target,true})??Array.Empty<string>();

                  var videoQueries=(IEnumerable<string>?)queriesM.Invoke(
                      null,new object?[]{show.title,"",show.year,target,false})??Array.Empty<string>();

                  foreach(var q in albumQueries.Concat(videoQueries).Distinct(StringComparer.OrdinalIgnoreCase))
                  {
                      var root=await Search(q);
                      if(root?.response?.albums!=null)albums.AddRange(root.response.albums);
                      if(root?.response?.catalog_videos!=null)
                          videos.AddRange(root.response.catalog_videos.Where(x=>x?.video!=null).Select(x=>x.video));
                  }

                  videos=videos.Where(v=>v!=null&&v.owner_id!=0&&v.id>0)
                      .GroupBy(v=>$"{v.owner_id}:{v.id}")
                      .Select(g=>g.First())
                      .ToList();

                  // Production-like strong video -> owner discovery.
                  var strongParsed=Parse(
                      videos.Where(v=>VideoScore(v,st,show.year)>=900),
                      0
                  ).Where(x=>x.season>0).ToList();

                  var owners=strongParsed
                      .GroupBy(x=>x.video.owner_id)
                      .Select(g=>new{
                          owner=g.Key,
                          episodes=g.Select(x=>(x.season,x.episode)).Distinct().Count()
                      })
                      .Where(x=>x.owner!=0&&x.episodes>=2)
                      .OrderByDescending(x=>x.episodes)
                      .Take(4)
                      .ToList();

                  foreach(var o in owners)
                  {
                      if(!ownerAlbumCache.TryGetValue(o.owner,out var ownerAlbums))
                      {
                          ownerAlbums=await AllAlbums(o.owner);
                          ownerAlbumCache[o.owner]=ownerAlbums;
                      }

                      albums.AddRange(ownerAlbums.Where(a=>AlbumScore(a,st,show.year)>0));
                  }

                  var candidates=albums
                      .Where(a=>a!=null&&a.id>0&&a.owner_id!=0)
                      .GroupBy(a=>$"{a.owner_id}:{a.id}")
                      .Select(g=>g.First())
                      .Select(a=>new{
                          a,
                          score=AlbumScore(a,st,show.year),
                          season=Season(a.title),
                          multi=Multi(a.title)
                      })
                      .Where(x=>x.score>0)
                      .Select(x=>new{
                          x.a,
                          score=x.multi?Math.Max(1,x.score-200):x.score,
                          season=(short)(x.multi?0:x.season),
                          x.multi
                      })
                      .Where(x=>x.season==target||x.season==0)
                      .OrderByDescending(x=>x.score)
                      .ThenByDescending(x=>x.a.count)
                      .Take(8)
                      .ToList();

                  var valid=new List<(VideoAlbum a,int score,int count,int first,int last,bool noise)>();

                  foreach(var x in candidates)
                  {
                      var vids=await Album(x.a.owner_id,x.a.id);
                      short hint=x.season;
                      var parsed=Parse(vids,hint)
                          .Where(p=>p.season==target)
                          .ToList();

                      if(parsed.Count==0)continue;

                      bool explicitSeason=x.season==target&&!x.multi;
                      if(explicitSeason)
                      {
                          if(!Confident(parsed,3,4*60))continue;
                      }
                      else
                      {
                          if(!Confident(parsed,3,8*60))continue;
                      }

                      var eps=parsed.Select(p=>p.episode).Distinct().OrderBy(e=>e).ToArray();
                      valid.Add((
                          x.a,x.score,eps.Length,eps.First(),eps.Last(),
                          parsed.Any(p=>Noise(p.video))
                      ));
                  }

                  var best=valid
                      .OrderByDescending(x=>x.score+Math.Min(x.count,30)*10)
                      .ThenByDescending(x=>x.count)
                      .FirstOrDefault();

                  if(best.a!=null)
                  {
                      found.Add(new{
                          season=target,source=best.a.title,best.a.owner_id,best.a.id,
                          episodes=best.count,first=best.first,last=best.last,
                          noise=best.noise,score=best.score
                      });
                  }
              }

              Console.WriteLine(JsonSerializer.Serialize(new{
                  kind="show",show=show.title,seasons=found
              }));
          }

          async Task<Root?> Search(string q)
          {
              string json=await Post($"{api}/catalog.getVideoSearchWeb2?v={ver}&client_id={clientId}",new(){
                  ["access_token"]=token,["screen_ref"]="search_video_service",
                  ["input_method"]="keyboard_search_button",["extended"]="1",
                  ["count"]="50",["q"]=q
              });

              return JsonSerializer.Deserialize<Root>(
                  json,new JsonSerializerOptions{PropertyNameCaseInsensitive=true});
          }

          async Task<List<VideoAlbum>> AllAlbums(long owner)
          {
              var result=new List<VideoAlbum>();

              for(int offset=0;offset<5000;offset+=100)
              {
                  string json=await Post($"{api}/video.getAlbums?v={ver}&client_id={clientId}",new(){
                      ["access_token"]=token,["owner_id"]=owner.ToString(),
                      ["count"]="100",["offset"]=offset.ToString(),
                      ["extended"]="1",["need_system"]="0"
                  });

                  var root=JsonSerializer.Deserialize<VideoAlbumsRoot>(
                      json,new JsonSerializerOptions{PropertyNameCaseInsensitive=true});

                  if(root?.response?.items==null||root.response.items.Count==0)break;
                  result.AddRange(root.response.items);

                  if(result.Count>=root.response.count||root.response.items.Count<100)break;
              }

              return result;
          }

          async Task<List<Video>> Album(long owner,long album)
          {
              var result=new List<Video>();

              for(int offset=0;offset<5000;offset+=200)
              {
                  string json=await Post($"{api}/video.getFromAlbum?v={ver}&client_id={clientId}",new(){
                      ["access_token"]=token,["owner_id"]=owner.ToString(),
                      ["album_id"]=album.ToString(),["offset"]=offset.ToString(),
                      ["extended"]="1",["count"]="200"
                  });

                  var root=JsonSerializer.Deserialize<VideoFromAlbumRoot>(
                      json,new JsonSerializerOptions{PropertyNameCaseInsensitive=true});

                  if(root?.response?.items==null||root.response.items.Count==0)break;

                  foreach(var item in root.response.items)
                  {
                      if(item?.video==null)continue;
                      item.video.playlist_position=item.playlist_position;
                      result.Add(item.video);
                  }

                  if(result.Count>=root.response.count||root.response.items.Count<200)break;
              }

              return result;
          }

          async Task<string> Post(string url,Dictionary<string,string> form)
          {
              using var res=await http.PostAsync(url,new FormUrlEncodedContent(form));
              return await res.Content.ReadAsStringAsync();
          }
          EOF

          dotnet run --project .tmp/VkSeriesAlbumAudit/Audit.csproj --configuration Release
