name: TranslationSub Storage Migration Diagnostic

on:
  push:
    branches:
      - TranslationSub-release
    paths:
      - 'Modules/TranslationSub/**'
      - 'scripts/ci/translationsub-storage-migration-diagnostic.py'
      - '.github/workflows/translationsub-storage-migration-diagnostic.yml'
  pull_request:
    paths:
      - 'Modules/TranslationSub/**'
      - 'scripts/ci/translationsub-storage-migration-diagnostic.py'
      - '.github/workflows/translationsub-storage-migration-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-json-migration:
    name: Legacy JSON -> SQLite preservation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish isolated Lampac runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lampac-storage-migration
          dotnet publish Core/Core.csproj \
            --configuration Release \
            --output /tmp/lampac-storage-migration \
            --verbosity minimal \
            -p:PlaywrightPlatform=linux-x64
          test -f /tmp/lampac-storage-migration/Core.dll
          test -f /tmp/lampac-storage-migration/module/TranslationSub/manifest.json

      - name: Seed legacy JSON storage
        shell: bash
        env:
          TRANSLATIONSUB_RUNTIME: /tmp/lampac-storage-migration
        run: |
          set -euo pipefail
          python3 scripts/ci/translationsub-storage-migration-diagnostic.py seed
          cat > /tmp/lampac-storage-migration/init.yaml <<'YAML'
          chromium:
            enable: false
          firefox:
            enable: false
          rch:
            enable: false
          cache:
            type: mem
          accsdb:
            enable: false
          BaseModule:
            LoadModules:
              - TranslationSub
          listen:
            port: 9118
          YAML

      - name: Start Lampac
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/lampac-storage-migration && exec dotnet Core.dll > /tmp/lampac-storage-migration.log 2>&1) &
          echo $! > /tmp/lampac-storage-migration.pid
          ready=0
          for _ in $(seq 1 120); do
            if curl -fsS --max-time 2 'http://127.0.0.1:9118/translationsub/v2/settings?uid=migration-victim%40translationsub.test' >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/lampac-storage-migration.pid)" 2>/dev/null; then
              tail -n 400 /tmp/lampac-storage-migration.log || true
              exit 1
            fi
            sleep 0.5
          done
          test "$ready" = 1

      - name: Verify legacy state survived migration
        shell: bash
        env:
          TRANSLATIONSUB_RUNTIME: /tmp/lampac-storage-migration
          TRANSLATIONSUB_BASE_URL: http://127.0.0.1:9118
        run: python3 scripts/ci/translationsub-storage-migration-diagnostic.py verify

      - name: Diagnostic state
        if: failure()
        shell: bash
        run: |
          set +e
          echo '===== database files ====='
          find /tmp/lampac-storage-migration/database -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null || true
          echo '===== Lampac tail ====='
          tail -n 400 /tmp/lampac-storage-migration.log 2>/dev/null || true

      - name: Stop Lampac
        if: always()
        shell: bash
        run: |
          set +e
          [ -f /tmp/lampac-storage-migration.pid ] && kill "$(cat /tmp/lampac-storage-migration.pid)" 2>/dev/null || true
