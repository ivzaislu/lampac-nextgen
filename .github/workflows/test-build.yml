---
name: Test - Build all projects

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read
  packages: read
  id-token: write

jobs:
  test-build:
    name: Test build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}

      - name: Restore
        run: dotnet restore --verbosity minimal NextGen.slnx

      - name: Build
        run: dotnet build NextGen.slnx --configuration Release --verbosity minimal

      - name: DatabaseEditor migration smoke test
        run: dotnet run --project Modules/DatabaseEditor.MigrationSmoke/DatabaseEditor.MigrationSmoke.csproj --configuration Release
        env:
          MIGRATION_SMOKE_ROOT: ${{ runner.temp }}/database-editor-migration-smoke

      - name: Upload migration smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: database-editor-migration-smoke
          path: ${{ runner.temp }}/database-editor-migration-smoke
          include-hidden-files: true
          retention-days: 7
