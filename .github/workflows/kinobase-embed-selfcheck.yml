name: Kinobase offline embed self-check
on:
  push:
    branches: [cinemar]
    paths:
      - 'Modules/OnlineRUS/Kinobase/**'
      - '.github/scripts/kinobase-embed-selfcheck.cs'
      - '.github/workflows/kinobase-embed-selfcheck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  embed:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build Kinobase
        run: dotnet build Modules/OnlineRUS/Kinobase/Kinobase.csproj -c Release --nologo
      - name: Check native payload and existing Embed contract
        run: dotnet run --file .github/scripts/kinobase-embed-selfcheck.cs
