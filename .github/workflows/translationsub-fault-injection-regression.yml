name: TranslationSub Fault Injection Regression

on:
  push:
    branches:
      - TranslationSub-final
    paths:
      - 'Modules/TranslationSub/**'
      - 'scripts/ci/translationsub-fault-injection-regression.py'
      - 'scripts/ci/translationsub-fault-source-fallback.py'
      - '.github/workflows/translationsub-fault-injection-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translationsub-fault-injection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-faults:
    name: Metadata + TMDB + source fallback faults
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}

      - name: Publish Lampac runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lampac-runtime
          dotnet publish Core/Core.csproj \
            --configuration Release \
            --output /tmp/lampac-runtime \
            --verbosity minimal \
            -p:PlaywrightPlatform=linux-x64

          test -f /tmp/lampac-runtime/Core.dll
          test -f /tmp/lampac-runtime/module/TranslationSub/manifest.json
          test -f /tmp/lampac-runtime/module/Sync/TimeCode/manifest.json
          test -f /tmp/lampac-runtime/module/OnlineRUS/Phantom/manifest.json

          echo '127.0.0.1 translationsub-fault.test' | sudo tee -a /etc/hosts >/dev/null

          cat > /tmp/lampac-runtime/init.yaml <<'YAML'
          chromium:
            enable: false
          firefox:
            enable: false
          rch:
            enable: false
          cache:
            type: mem
          serilog: true
          accsdb:
            enable: false
          BaseModule:
            LoadModules:
              - TranslationSub
              - TimeCode
              - FlixCDN
              - Phantom
          listen:
            port: 9118
          YAML

          cat > /tmp/lampac-runtime/init.conf <<'JSON'
          {
            "TranslationSub": {
              "enable": true,
              "tmdb_apihost": "http://127.0.0.1:9122/tmdb",
              "tmdb_apikey": "ci-fault-key"
            },
            "FlixCDN": {
              "enable": true,
              "overridehost": "http://translationsub-fault.test:9122/meta"
            },
            "Phantom": {
              "enable": true,
              "overridehost": "http://translationsub-fault.test:9123/meta"
            }
          }
          JSON

      - name: Start controllable external-service fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/translationsub-fault-injection-regression.py serve > /tmp/translationsub-fault-fixture.log 2>&1 &
          echo $! > /tmp/translationsub-fault-fixture.pid

          python3 scripts/ci/translationsub-fault-source-fallback.py serve > /tmp/translationsub-phantom-fixture.log 2>&1 &
          echo $! > /tmp/translationsub-phantom-fixture.pid

          ready_main=0
          ready_phantom=0
          for i in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 2 'http://127.0.0.1:9122/health' >/dev/null; then
              ready_main=1
            fi
            if curl --silent --show-error --fail --max-time 2 'http://127.0.0.1:9123/health' >/dev/null; then
              ready_phantom=1
            fi
            if [ "$ready_main" = '1' ] && [ "$ready_phantom" = '1' ]; then
              break
            fi
            sleep 1
          done
          if [ "$ready_main" != '1' ] || [ "$ready_phantom" != '1' ]; then
            echo 'External-service fixtures did not become ready'
            cat /tmp/translationsub-fault-fixture.log || true
            cat /tmp/translationsub-phantom-fixture.log || true
            exit 1
          fi

      - name: Start Lampac and wait for TranslationSub
        shell: bash
        run: |
          set -euo pipefail
          (
            cd /tmp/lampac-runtime
            exec dotnet Core.dll > /tmp/lampac-fault.log 2>&1
          ) &
          echo $! > /tmp/lampac-fault.pid

          ready=0
          for i in $(seq 1 120); do
            if curl --silent --show-error --fail --max-time 2 \
              'http://127.0.0.1:9118/translationsub/v2/settings?uid=fault-metadata%40translationsub.test' \
              -o /tmp/fault-ready.json; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/lampac-fault.pid)" 2>/dev/null; then
              echo 'Lampac exited before TranslationSub became ready'
              tail -n 400 /tmp/lampac-fault.log || true
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != '1' ]; then
            echo 'TranslationSub did not become ready'
            tail -n 400 /tmp/lampac-fault.log || true
            exit 1
          fi

      - name: Run metadata and TMDB fault-injection stages
        run: python3 scripts/ci/translationsub-fault-injection-regression.py run

      - name: Run metadata timeout and source fallback stages
        run: python3 scripts/ci/translationsub-fault-source-fallback.py run

      - name: Reject storage and unhandled runtime failures
        shell: bash
        run: |
          set -euo pipefail
          if grep -E -i 'database is locked|SQLite Error|SqliteException|Unhandled exception' /tmp/lampac-fault.log; then
            echo 'Unexpected SQLite or unhandled runtime failure detected'
            exit 1
          fi

      - name: Runtime log tails
        if: always()
        shell: bash
        run: |
          echo '===== lampac-fault.log tail ====='
          tail -n 500 /tmp/lampac-fault.log 2>/dev/null || true
          echo '===== serilog TranslationSub metadata tail ====='
          grep -E -i 'TranslationSub metadata|SQLite|Sqlite|Unhandled' /tmp/lampac-runtime/logs/app-*.log 2>/dev/null | tail -n 500 || true
          echo '===== main fixture ====='
          tail -n 200 /tmp/translationsub-fault-fixture.log 2>/dev/null || true
          echo '===== Phantom fixture ====='
          tail -n 200 /tmp/translationsub-phantom-fixture.log 2>/dev/null || true

      - name: Stop processes
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/lampac-fault.pid ]; then
            kill "$(cat /tmp/lampac-fault.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/translationsub-fault-fixture.pid ]; then
            kill "$(cat /tmp/translationsub-fault-fixture.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/translationsub-phantom-fixture.pid ]; then
            kill "$(cat /tmp/translationsub-phantom-fixture.pid)" 2>/dev/null || true
          fi
