name: FanCDN 2.0 Lampac integration

on:
  push:
    branches: [fancdn-2.0-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Validate module manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          module = Path("Modules/OnlineRUS/FanCDN.2.0")
          manifest = json.loads((module / "manifest.json").read_text())
          assert manifest["enable"] and manifest["dynamic"]
          assert set(manifest["tree"]) == {p.name for p in module.glob("*.cs")}
          print("Manifest matches module source files")
          import re
          for file in module.glob("*.cs"):
              assert not re.search(r"playwright|browserGate|browserCookie|GetBrowserPage", file.read_text(), re.I), f"Browser dependency remains in {file.name}"
          print("PASS: module contains no Playwright references")
          PY

      - name: Build complete NextGen solution
        run: dotnet build NextGen.slnx --configuration Release --verbosity minimal -p:PlaywrightPlatform=linux-x64

      - name: Build FanCDN.2.0 separately
        run: dotnet build Modules/OnlineRUS/FanCDN.2.0/FanCDN.2.0.csproj --configuration Release --verbosity minimal -p:PlaywrightPlatform=linux-x64

      - name: Publish complete Lampac NextGen
        run: |
          dotnet publish Core/Core.csproj --configuration Release --output /tmp/lampac-ci --verbosity minimal -p:PlaywrightPlatform=linux-x64
          test -f /tmp/lampac-ci/Core.dll
          test -f /tmp/lampac-ci/module/OnlineRUS/FanCDN.2.0/manifest.json

      - name: Start local fixture and published Lampac
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fancdn-fixture.py <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import urlsplit, parse_qs
          import json

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  u = urlsplit(self.path)
                  q = parse_qs(u.query)
                  content_type = "text/html; charset=utf-8"
                  status = 200
                  if "ci_session=fixture" not in self.headers.get("Cookie", ""):
                      status, body = 403, "fixture requires cookie"
                  elif u.path == "/engine/ajax/msearch.php":
                      title = q.get("q", [""])[0]
                      entries = {
                          "Fixture Movie": {"title": "Fixture Movie", "original_title": "Fixture Movie", "year": "2024", "url": "/100-fixture-movie.html"},
                          "Fixture Series": {"title": "Fixture Series", "original_title": "Fixture Series", "year": "2024", "url": "/200-fixture-series.html"}
                      }
                      body = json.dumps([entries[title]] if title in entries else [])
                      content_type = "application/json"
                  elif u.path == "/100-fixture-movie.html":
                      body = '<iframe src="/movies/123456?key=fixture"></iframe>'
                  elif u.path == "/film.php" and q.get("kp") == ["123456"] and q.get("key") == ["fixture"]:
                      body = json.dumps([{"title": "Fixture Movie Voice", "file": "https://cdn.fancdn.net/ci/movie/hls.m3u8", "subtitles": "[English]en.vtt"}])
                      content_type = "application/json"
                  elif u.path == "/200-fixture-series.html":
                      body = '<a href="/200-fixture-series/1-season.html">Season 1</a><a href="/200-fixture-series/2-season.html">Season 2</a>'
                  elif u.path == "/200-fixture-series/1-season.html":
                      body = ''.join(f'<a href="/200-fixture-series/1-season/{n}-episode.html">Episode {n}</a>' for n in (1, 2))
                  elif u.path in ("/200-fixture-series/1-season/1-episode.html", "/200-fixture-series/1-season/2-episode.html"):
                      n = u.path.rsplit("/", 1)[-1].split("-")[0]
                      body = '<h1 class="page-title">Episode ' + n + '</h1><script>' + ''.join(
                          'window.cdnData[' + str(i) + '] = ' + json.dumps({"name": name, "player": f"https://cdn.fancdn.net/ci/{n}/{i}/hls.m3u8"}) + ';'
                          for i, name in enumerate(("Fixture Voice A", "Fixture Voice B"))
                      ) + '</script>'
                  else:
                      status, body = 404, "fixture route not found"
                  data = body.encode()
                  self.send_response(status)
                  self.send_header("Content-Type", content_type)
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)

          ThreadingHTTPServer(("127.0.0.1", 9130), Handler).serve_forever()
          PY
          python3 /tmp/fancdn-fixture.py > /tmp/fancdn-fixture.log 2>&1 &
          echo $! > /tmp/fancdn-fixture.pid

          cat > /tmp/lampac-ci/init.yaml <<'YAML'
          chromium:
            enable: false
          firefox:
            enable: false
          rch:
            enable: false
          cache:
            type: mem
          accsdb:
            enable: false
          BaseModule:
            LoadModules:
              - FanCDN.2.0
          listen:
            port: 9128
          YAML

          cat > /tmp/lampac-ci/init.conf <<'JSON'
          {
            "FanCDN.2.0": {
              "enable": true,
              "host": "http://127.0.0.1:9130",
              "cookie": "ci_session=fixture",
              "streamproxy": true
            }
          }
          JSON

          (cd /tmp/lampac-ci && exec dotnet Core.dll > /tmp/lampac-ci.log 2>&1) &
          echo $! > /tmp/lampac-ci.pid
          ready=0
          for _ in $(seq 1 180); do
            code=$(curl -s --max-time 2 -o /tmp/lampac-ready.txt -w '%{http_code}' 'http://127.0.0.1:9128/lite/fancdn.2.0?kinopoisk_id=0' || true)
            if [ "$code" = 503 ] && grep -Fq 'loaded module: FanCDN.2.0' /tmp/lampac-ci.log; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/lampac-ci.pid)" 2>/dev/null; then
              tail -n 300 /tmp/lampac-ci.log || true
              exit 1
            fi
            sleep 1
          done
          test "$ready" = 1
          echo "PASS: published Lampac dynamically compiled and loaded FanCDN.2.0"

      - name: Smoke test movie, seasons, episodes and voices through Lampac
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen
          from urllib.parse import urlencode
          import json

          def get(url):
              with urlopen(url, timeout=30) as response:
                  body = response.read().decode()
                  assert response.status == 200, (response.status, body)
                  return json.loads(body)

          def request(**params):
              params.update(rjson="true", year=2024)
              return get("http://127.0.0.1:9128/lite/fancdn.2.0?" + urlencode(params))

          movie = request(kinopoisk_id=123456, title="Fixture Movie", original_title="Fixture Movie")
          movie_text = json.dumps(movie, ensure_ascii=False)
          assert "Fixture Movie Voice" in movie_text and "English" in movie_text, movie
          print("PASS: movie and subtitles")

          series = dict(kinopoisk_id=234567, title="Fixture Series", original_title="Fixture Series", serial=1)
          seasons = request(**series)
          assert seasons["type"] == "season", seasons
          assert [row["name"] for row in seasons["data"]] == ["1 сезон", "2 сезон"], seasons
          print("PASS: season listing")

          episodes = get(seasons["data"][0]["url"])
          assert episodes["type"] == "episode", episodes
          assert [row["e"] for row in episodes["data"]] == [1, 2], episodes
          assert {row["name"] for row in episodes["voice"]} == {"Fixture Voice A", "Fixture Voice B"}, episodes
          assert all(row["details"] == "Fixture Voice A" for row in episodes["data"]), episodes
          print("PASS: episodes and voice listing")

          voice_b = next(row for row in episodes["voice"] if row["name"] == "Fixture Voice B")
          alternate = get(voice_b["url"])
          assert [row["e"] for row in alternate["data"]] == [1, 2], alternate
          assert all(row["details"] == "Fixture Voice B" for row in alternate["data"]), alternate
          assert any(row["name"] == "Fixture Voice B" and row.get("active") for row in alternate["voice"]), alternate
          print("PASS: alternate voice via generated link")

          logs = open("/tmp/lampac-ci.log").read()
          assert "loaded module: FanCDN.2.0" in logs
          print("PASS: HTTP-only fixture integration (no real FanSeries/CDN playback)")
          PY

      - name: Diagnostics
        if: always()
        run: |
          tail -n 300 /tmp/lampac-ci.log 2>/dev/null || true
          tail -n 100 /tmp/fancdn-fixture.log 2>/dev/null || true

      - name: Stop test services
        if: always()
        run: |
          for p in /tmp/lampac-ci.pid /tmp/fancdn-fixture.pid; do
            if [ -f "$p" ]; then kill "$(cat "$p")" 2>/dev/null || true; fi
          done

      - name: Live FanSeries 50 films and 50 series HTTP-only expanded regression
        env:
          FANCDN_COOKIE: ${{ secrets.FANCDN_COOKIE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FANCDN_COOKIE" ]; then
            echo "FAIL: FANCDN_COOKIE secret missing"
            exit 1
          fi
          umask 077
          # Instrument the published copy only, not the production module.
          python3 - <<'PY'
          import os, json, shutil
          from pathlib import Path
          root = Path("/tmp/lampac-ci")
          module = root / "module/OnlineRUS/FanCDN.2.0"
          (root / "init.conf").write_text(json.dumps({
              "FanCDN.2.0": {"enable": True, "host": "https://1fanserials.org",
                             "cookie": os.environ["FANCDN_COOKIE"], "streamproxy": True}
          }))
          shutil.rmtree(root / "cache/module", ignore_errors=True)
          p = module / "Controller.cs"
          s = p.read_text()
          a = s.index("    Task<string> GetSiteHttp(")
          b = s.index("    async Task<string> SiteGetFast(", a)
          s = s[:a] + """
          static string TraceStage(string url)
          {
              if (!Uri.TryCreate(url, UriKind.Absolute, out var u)) return "invalid";
              var path = u.AbsolutePath;
              if (path == "/engine/ajax/msearch.php") return "search";
              if (path == "/film.php") return "film-api";
              if (path == "/index.php") return "news-page";
              if (path.EndsWith("-episode.html")) return "episode-page";
              if (path.EndsWith("-season.html")) return "season-page";
              return "content-page";
          }

          async Task<string> GetSiteHttp(string url, IReadOnlyList<HeadersModel> headers)
          {
              if (!IsSiteUrl(url)) { Console.WriteLine("FANTRACE blocked-origin"); return null; }
              var stage = TraceStage(url);
              var sw = System.Diagnostics.Stopwatch.StartNew();
              Console.WriteLine($"FANTRACE request stage={stage} method=GET host={new Uri(url).Host}");
              var response = await httpHydra.Get(url, addheaders: headers, safety: true, cookieContainer: siteCookies);
              Console.WriteLine($"FANTRACE response stage={stage} elapsed_ms={sw.ElapsedMilliseconds} chars={response?.Length ?? 0} empty={string.IsNullOrWhiteSpace(response)} challenge={IsChallengeResponse(response)} auth={RequiresAuth(response)}");
              return response;
          }
          """ + s[b:]
          old = 'streamfile => HostStreamProxy(streamfile, streamHeaders)'
          assert old in s
          s = s.replace(old, '''streamfile =>
                  {
                      Console.WriteLine($"FANTRACE stream resolved host={(Uri.TryCreate(streamfile, UriKind.Absolute, out var u) ? u.Host : "invalid")}");
                      return HostStreamProxy(streamfile, streamHeaders);
                  }''')
          p.write_text(s)
          p = module / "ModInit.cs"
          s = p.read_text()
          s = s.replace("        updateConf();", '''        EventListener.HttpResponse += e =>
                  {
                      if (System.Uri.TryCreate(e.url, System.UriKind.Absolute, out var u) && u.Host == "1fanserials.org")
                      {
                          var path = u.AbsolutePath;
                          string stage = path == "/engine/ajax/msearch.php" ? "search" : path == "/film.php" ? "film-api" : path == "/index.php" ? "news-page" : path.EndsWith("-episode.html") ? "episode-page" : path.EndsWith("-season.html") ? "season-page" : "content-page";
                          System.Console.WriteLine($"FANTRACE http stage={stage} status={(int)(e.response?.StatusCode ?? 0)} chars={e.result?.Length ?? 0}");
                      }
                      return System.Threading.Tasks.Task.CompletedTask;
                  };
                  updateConf();''', 1)
          p.write_text(s)
          PY
          unset FANCDN_COOKIE
          (cd /tmp/lampac-ci && exec dotnet Core.dll > /tmp/fancdn-live.log 2>&1) &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            echo 'Live diagnostic finished; per-case redacted trace is printed above.'
            rm -f /tmp/lampac-ci/init.conf /tmp/fancdn-live.log
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 120); do
            code=$(curl -s --max-time 2 -o /dev/null -w '%{http_code}' 'http://127.0.0.1:9128/lite/fancdn.2.0?kinopoisk_id=0' || true)
            if [ "$code" = 503 ] && grep -Fq 'loaded module: FanCDN.2.0' /tmp/fancdn-live.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "FAIL: live diagnostic Lampac did not start"
            grep -oE 'error CS[0-9]+' /tmp/fancdn-live.log | sort -u || true
            exit 1
          fi
          python3 - <<'PY'
          import json, os, time
          from urllib.request import urlopen
          from urllib.parse import urlencode, urlsplit, urljoin
          from urllib.error import HTTPError

          base = "http://127.0.0.1:9128"

          def get(stage, url, manifest=False):
              start = time.monotonic()
              u = urlsplit(url)
              assert u.scheme == "http" and u.netloc == "127.0.0.1:9128", "unexpected local link"
              try:
                  with urlopen(url, timeout=90) as res:
                      limit = 16 * 1024 * 1024 if manifest else 8 * 1024 * 1024
                      body = res.read(limit + 1)
                      assert len(body) <= limit, "diagnostic response size limit exceeded"
                      elapsed = round((time.monotonic()-start)*1000)
                      print(f"LIVE {stage}: HTTP {res.status}; {elapsed}ms; bytes={len(body)}; cache={res.headers.get('X-Invoke-Cache','-')}", flush=True)
                      if manifest:
                          ok = body.lstrip().startswith(b"#EXTM3U")
                          print(f"LIVE {stage}: hls_manifest={ok}", flush=True)
                          assert ok, "invalid HLS manifest"
                          return body.decode("utf-8-sig")
                      data = json.loads(body)
                      print(f"LIVE {stage}: type={data.get('type','unknown')}; items={len(data.get('data') or [])}; voices={len(data.get('voice') or [])}", flush=True)
                      return data
              except HTTPError as e:
                  body = e.read(256).decode(errors="replace").strip()
                  marker = body if body in {"search","embed","serial","seasons","cookie","disable","cors-not-supported","network","timeout"} else "redacted"
                  print(f"LIVE {stage}: HTTP {e.code}; marker={marker}; elapsed_ms={round((time.monotonic()-start)*1000)}", flush=True)
                  raise RuntimeError("HTTP error") from None
              except Exception as e:
                  print(f"LIVE {stage}: {type(e).__name__}", flush=True)
                  raise RuntimeError("request error") from None

          def request(stage, **params):
              params["rjson"] = "true"
              return get(stage, base+"/lite/fancdn.2.0?"+urlencode(params))

          def probe(stage, data, index=0):
              row = data["data"][index]
              url = row.get("url") or row.get("stream")
              u = urlsplit(url or "")
              print(f"LIVE {stage}: stream_link_present={bool(url)}; host={u.hostname or 'none'}; subtitles={len(row.get('subtitles') or [])}", flush=True)
              assert u.netloc == "127.0.0.1:9128", "expected Lampac proxy stream"
              manifest = get(stage+" manifest", url, manifest=True)
              if "#EXT-X-STREAM-INF:" in manifest:
                  lines = [line.strip() for line in manifest.splitlines() if line.strip()]
                  child = next(lines[i+1] for i,line in enumerate(lines[:-1]) if line.startswith("#EXT-X-STREAM-INF:") and not lines[i+1].startswith("#"))
                  manifest = get(stage+" media playlist", urljoin(url,child), manifest=True)
              assert "#EXTINF:" in manifest, "media playlist contains no segments"
              print(f"LIVE {stage}: media playlist segments={manifest.count('#EXTINF:')}", flush=True)

          movies = [
              (258687,"Интерстеллар","Interstellar",2014),
              (447301,"Начало","Inception",2010),
