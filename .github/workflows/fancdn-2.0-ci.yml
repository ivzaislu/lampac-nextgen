              (251733,"Аватар","Avatar",2009),
              (195334,"Престиж","The Prestige",2006),
              (397667,"Остров проклятых","Shutter Island",2010),
              (586397,"Джанго освобождённый","Django Unchained",2012),
              (81314,"Отступники","The Departed",2006),
              (325,"Крёстный отец","The Godfather",1972),
              (328,"Властелин колец: Братство Кольца","The Lord of the Rings: The Fellowship of the Ring",2001),
              (689,"Гарри Поттер и философский камень","Harry Potter and the Philosopher's Stone",2001),
              (476,"Назад в будущее","Back to the Future",1985),
              (329,"Властелин колец: Две крепости","The Lord of the Rings: The Two Towers",2002),
              (3498,"Властелин колец: Возвращение короля","The Lord of the Rings: The Return of the King",2003),
              (444,"Терминатор 2: Судный день","Terminator 2: Judgment Day",1991),
