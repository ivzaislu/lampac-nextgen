              (581937,"Карточный домик","House of Cards",2013),
              (821565,"Нарко","Narcos",2015),
              (1032606,"Тьма","Dark",2017),
              (1046206,"Бумажный дом","La casa de papel",2017),
              (958500,"Охотник за разумом","Mindhunter",2017),
              (1118138,"Мандалорец","The Mandalorian",2019),
