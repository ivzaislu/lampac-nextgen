name: Kinobase proxy connectivity diagnostics
on:
  push:
    branches: [cinemar]
    paths:
      - '.github/workflows/kinobase-proxy-connectivity.yml'
      - '.github/scripts/kinobase-proxy-candidates.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proxy-connectivity:
    name: Public proxy connectivity (neutral endpoint)
    runs-on: ubuntu-26.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check fresh public candidates
        shell: bash
        run: bash .github/scripts/kinobase-proxy-candidates.sh "$RUNNER_TEMP/kinobase-verified-proxies"
