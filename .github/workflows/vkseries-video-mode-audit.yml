name: VkSeries video-mode audit

on:
  push:
    branches: [vkseries-global-clean-20260925]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}
      - name: Test content_type video search
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/VkSeriesVideoMode
          cat >.tmp/VkSeriesVideoMode/Probe.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <OutputType>Exe</OutputType>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../Modules/OnlineRUS/VkSeries/VkSeries.csproj" />
            </ItemGroup>
          </Project>
          EOF

          cat >.tmp/VkSeriesVideoMode/Program.cs <<'EOF'
          using System.Collections;
          using System.Reflection;
          using System.Text.Json;
          using Shared.Services.Utilities;
          using VkSeries;

          var shows=new (string title,short year)[]{
              ("Интерны",2010),("Универ",2008),("Воронины",2009),("Молодёжка",2013),
              ("Физрук",2014),("Полицейский с Рублёвки",2016),("Ивановы-Ивановы",2017),
              ("Отель Элеон",2016),("Реальные пацаны",2010),("Папины дочки",2007)
          };

          var t=typeof(VkSeriesController);
          var directM=t.GetMethod("ParseTrustedDirectVideos",BindingFlags.Static|BindingFlags.NonPublic)!;
          var queriesM=t.GetMethod("BuildSearchQueries",BindingFlags.Static|BindingFlags.NonPublic)!;

          List<(short season,short episode,Video video)> Read(object? value)
          {
              var r=new List<(short,short,Video)>();
              foreach(var item in (IEnumerable?)value??Array.Empty<object>())
              {
                  if(item is null)continue;
                  var it=item.GetType();
                  short s=(short)(it.GetProperty("season")?.GetValue(item)??(short)0);
                  short e=(short)(it.GetProperty("episode")?.GetValue(item)??(short)0);
                  var v=(Video?)it.GetProperty("video")?.GetValue(item);
                  if(v!=null)r.Add((s,e,v));
              }
              return r;
          }

          using var http=new HttpClient{Timeout=TimeSpan.FromSeconds(30)};
          const int clientId=52461373;
          const string api="https://api.vkvideo.ru/method";
          const string ver="5.282";

          using var auth=JsonDocument.Parse(await Post($"{api}/auth.getAnonymToken?v={ver}&client_id={clientId}",new()));
          string token=auth.RootElement.GetProperty("response").GetProperty("token").GetString()!;

          foreach(var show in shows)
          {
              var result=new List<object>();
              string st=SearchNameTo.Convert(show.title)??"";

              for(short season=1;season<=4;season++)
              {
                  var all=new List<Video>();
                  var queries=(IEnumerable<string>?)queriesM.Invoke(
                      null,new object?[]{show.title,"",show.year,season,false})??Array.Empty<string>();

                  foreach(var q in queries.Take(3))
                  {
                      string json=await Post($"{api}/catalog.getVideoSearchWeb2?v={ver}&client_id={clientId}",new(){
                          ["access_token"]=token,
                          ["screen_ref"]="search_video_service",
                          ["input_method"]="keyboard_search_button",
                          ["extended"]="1",
                          ["count"]="30",
                          ["content_type"]="video",
                          ["q"]=q
                      });

                      var root=JsonSerializer.Deserialize<Root>(json,new JsonSerializerOptions{PropertyNameCaseInsensitive=true});
                      if(root?.response?.catalog_videos!=null)
                          all.AddRange(root.response.catalog_videos.Where(x=>x?.video!=null).Select(x=>x.video));
                  }

                  all=all.Where(x=>x!=null&&x.id>0&&x.owner_id!=0)
                      .GroupBy(x=>$"{x.owner_id}:{x.id}").Select(g=>g.First()).ToList();

                  var trusted=Read(directM.Invoke(null,new object?[]{all,st,"",show.year,season}))
                      .Where(x=>x.season==season)
                      .GroupBy(x=>x.episode)
                      .Select(g=>g.OrderByDescending(x=>x.video.duration).First())
                      .OrderBy(x=>x.episode)
                      .ToList();

                  if(trusted.Count>0)
                  {
                      result.Add(new{
                          season,
                          count=trusted.Count,
                          first=trusted.First().episode,
                          last=trusted.Last().episode,
                          owners=trusted.GroupBy(x=>x.video.owner_id).Select(g=>new{owner=g.Key,count=g.Count()}).OrderByDescending(x=>x.count).Take(3).ToArray(),
                          samples=trusted.Take(4).Select(x=>new{x.episode,x.video.title,x.video.duration}).ToArray()
                      });
                  }
              }

              Console.WriteLine(JsonSerializer.Serialize(new{kind="show",show=show.title,seasons=result}));
          }

          async Task<string> Post(string url,Dictionary<string,string> form)
          {
              using var res=await http.PostAsync(url,new FormUrlEncodedContent(form));
              return await res.Content.ReadAsStringAsync();
          }
          EOF

          dotnet run --project .tmp/VkSeriesVideoMode/Probe.csproj --configuration Release
