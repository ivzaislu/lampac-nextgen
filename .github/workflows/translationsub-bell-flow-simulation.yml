name: TranslationSub Bell Flow Simulation

on:
  push:
    branches:
      - TranslationSub-clean-legacy-api
    paths:
      - 'Modules/TranslationSub/translationsub-watch.js'
      - 'Modules/TranslationSub/translationsub-badge-state.js'
      - 'Modules/TranslationSub/translationsub-notice.js'
      - 'scripts/ci/translationsub-bell-flow-simulation.mjs'
      - '.github/workflows/translationsub-bell-flow-simulation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    name: Simulate 1 progress + 1 updates design
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate current flow anchors and simulate target design
        run: node scripts/ci/translationsub-bell-flow-simulation.mjs
