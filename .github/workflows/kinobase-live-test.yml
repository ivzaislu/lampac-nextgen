name: Kinobase live HTTP diagnostics
on:
  push:
    branches: [cinemar]
    paths:
      - '.github/workflows/kinobase-live-test.yml'
      - 'Modules/OnlineRUS/Kinobase/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build Kinobase
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          dotnet build Modules/OnlineRUS/Kinobase/Kinobase.csproj -c Release --nologo 2>&1 | tee diagnostics/build.log
      - name: Live HTTP metadata and HTML structure
        shell: bash
        run: |
          set -euo pipefail
          getent ahosts kinobase.org | tee diagnostics/dns.log || true
          python3 - <<'PY' | tee diagnostics/http.log
          import urllib.request, urllib.error, urllib.parse, re, time, os
          from pathlib import Path
          from html.parser import HTMLParser

          base = "https://kinobase.org"
          title = "Ночь живых мертвецов"

          def probe(label, url):
              start = time.monotonic()
              try:
                  response = urllib.request.urlopen(url, timeout=25)
              except urllib.error.HTTPError as e:
                  response = e
              except (OSError, urllib.error.URLError) as e:
                  print(f"{label}: connection_error={type(e).__name__}")
                  return None
              with response:
                  status = response.status
                  headers = response.headers
                  raw = response.read(4 * 1024 * 1024 + 1)
                  print(f"{label}: HTTP={status} bytes={len(raw)} elapsed_ms={(time.monotonic()-start)*1000:.0f} final_host={urllib.parse.urlsplit(response.geturl()).hostname}")
                  for key in ("server", "content-type", "cf-mitigated", "cf-ray", "retry-after"):
                      if headers.get(key):
                          print(f"  {key}: {headers[key]}")
                  if len(raw) > 4 * 1024 * 1024:
                      print("  body_limit_exceeded")
                      return None
                  body = raw.decode(headers.get_content_charset() or "utf-8", errors="replace")
                  print("  markers: " + " ".join(f"{k}={int(bool(re.search(p, body, re.I)))}" for k,p in {
                      "challenge": r"cf-chl-|/cdn-cgi/challenge-platform|just a moment",
                      "search_items": r'<li\s+class="x1 item">',
                      "playerjs_constructor": r'\bnew\s+Playerjs\s*\(',
                      "playerjs_script": r'playerjs\.[^" ]*js',
                      "file_property": r'\bfile\s*:',
                      "playerjsfile": r'id=["\x27]playerjsfile["\x27]',
                      "uppod": r'uppod',
                      "playlists": r'id=["\x27]playlists["\x27]',
                      "alert": r'class=["\x27]alert["\x27]',
                  }.items()))
                  return body if status == 200 and headers.get("cf-mitigated", "").lower() != "challenge" and urllib.parse.urlsplit(response.geturl()).hostname == "kinobase.org" else None

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href", "")
                      if href.startswith(("/film/", "/serial/")):
                          self.links.append(href)

          root = probe("root", base + "/")
          search = probe("search", base + "/search?" + urllib.parse.urlencode({"query": title}))
          if search is None:
              print("FAIL: search unavailable; detail not tested")
              raise SystemExit(1)
          parser = Links()
          parser.feed(search)
          print(f"search: detail_candidates={len(set(parser.links))}")
          if not parser.links:
              print("FAIL: no recognized detail links")
              raise SystemExit(1)
          detail_url = urllib.parse.urljoin(base, parser.links[0])
          if urllib.parse.urlsplit(detail_url).hostname != "kinobase.org":
              raise SystemExit("FAIL: unexpected detail host")
          detail = probe("detail", detail_url)
          if detail is None:
              print("FAIL: detail unavailable")
              raise SystemExit(1)
          Path(os.environ["RUNNER_TEMP"], "kinobase-detail-url").write_text(detail_url, encoding="utf-8")
          print("PASS: live HTTP search and detail access; player parsing not yet validated")
          PY
      - name: Publish host for bundled Playwright
        run: |
          set -euo pipefail
          dotnet publish Core/Core.csproj -c Release -o publish --nologo 2>&1 | tee diagnostics/publish.log
          test -f publish/.playwright/package/index.js
      - name: Live browser network and DOM comparison
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME_BIN" --version | tee diagnostics/chromium.log
          node <<'JS' | tee diagnostics/browser.log
          const fs = require('node:fs');
          const path = require('node:path');
          const { chromium } = require(path.resolve('publish/.playwright/package/index.js'));
          const target = new URL(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'kinobase-detail-url'), 'utf8').trim());
          if (target.protocol !== 'https:' || target.hostname !== 'kinobase.org') throw new Error('Unexpected detail origin');

          // Record categories and statuses only; never persist query strings,
          // request bodies, cookies, playlist values, or media URLs.
          const counts = new Map();
          const xhrDetails = [];
          const pending = [];
          // Only ordinary visible notice text, not response HTML or player data.
          function safeNotice(text) {
            return String(text || '').replace(/https?:\/\/\S+|www\.\S+/gi, '[url]')
              .replace(/[A-Za-z0-9_-]{20,}/g, '[redacted]')
              .replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 350);
          }
          async function inspectXhr(response) {
            const request = response.request();
            const url = new URL(request.url());
            if (url.hostname !== target.hostname || !['xhr', 'fetch'].includes(request.resourceType())) return;
            const headers = response.headers();
            const entry = {
              method: request.method(),
              path_shape: url.pathname.split('/').map(p => /^[a-z][a-z_.-]{0,30}$/i.test(p) ? p : p ? '[value]' : '').join('/'),
              query_count: Array.from(url.searchParams).length,
              status: response.status(),
              content_type: (headers['content-type'] || '').split(';')[0]
            };
            const len = Number(headers['content-length'] || 0);
            if (len <= 1024 * 1024 && /text\/html|json|javascript|text\/plain/i.test(entry.content_type)) {
              try {
                const body = await response.text();
                entry.body_chars = body.length;
                if (body.length <= 1024 * 1024) {
                  entry.markers = {
                    alert: /class\s*=\s*["'][^"']*\balert\b/i.test(body),
                    comments: /\bcomments?\b|комментар/iu.test(body),
                    playerjs: /\bPlayerjs\b/i.test(body),
                    file_property: /(?:\bfile\b|["']file["'])\s*:/i.test(body),
                    playlist: /\bplaylist\b/i.test(body),
                    geo: /(?:географическ|геоблок|регион|вашей стране|your country|your region|geo.block)/iu.test(body)
                  };
                }
              } catch { entry.body_unavailable = true; }
            }
            xhrDetails.push(entry);
          }
          function classify(raw, type) {
            try {
              const u = new URL(raw);
              if (!['http:', 'https:'].includes(u.protocol)) return null;
              const same = u.hostname === target.hostname;
              let route = 'other';
              if (type === 'document') route = 'document';
              else if (type === 'script') {
                const file = u.pathname.split('/').pop() || '';
                route = /^(?:playerjs|uppod|jquery|boot)(?:[.\w-]*)\.js$/i.test(file) ? file : 'script';
              } else if (['xhr', 'fetch'].includes(type)) {
                route = /(?:^|\/)(?:ajax|api|player|playlist)(?:\/|\.|$)/i.test(u.pathname) ? 'player-or-api' : 'other-api';
              } else if (type === 'media') route = 'media';
              return { host: same ? target.hostname : u.hostname, route };
            } catch { return null; }
          }
          function record(request, status, contentType = '', challenge = false) {
            const type = request.resourceType();
            if (!['document', 'script', 'xhr', 'fetch', 'media'].includes(type)) return;
            const info = classify(request.url(), type);
            if (!info) return;
            const key = JSON.stringify({ type, ...info, status, contentType: contentType.split(';')[0], challenge });
            counts.set(key, (counts.get(key) || 0) + 1);
          }
          async function main() {
            let browser;
            let pageErrors = 0;
            try {
              browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true });
              const page = await browser.newPage();
              page.on('response', response => {
                const h = response.headers();
                record(response.request(), response.status(), h['content-type'] || '', h['cf-mitigated'] === 'challenge');
                if (['xhr', 'fetch'].includes(response.request().resourceType())) {
                  pending.push(inspectXhr(response).catch(() => {}));
                }
              });
              page.on('requestfailed', request => record(request, 'failed'));
              page.on('pageerror', () => pageErrors++);
              const navigation = await page.goto(target.href, { waitUntil: 'domcontentloaded', timeout: 30000 });
              console.log('navigation_http=' + (navigation?.status() ?? 0));
              await page.waitForLoadState('load', { timeout: 10000 }).catch(() => {});
              await page.waitForTimeout(5000);
              const summary = await page.evaluate(() => {
                const text = document.body?.innerText || '';
                const scripts = Array.from(document.scripts);
                const inline = scripts.filter(s => !s.src).map(s => s.textContent || '').join('\n');
                return {
                  dom_chars: document.documentElement.outerHTML.length,
                  external_scripts: scripts.filter(s => s.src).length,
                  inline_scripts: scripts.filter(s => !s.src).length,
                  playerjs_constructor_inline: /\bnew\s+Playerjs\s*\(/i.test(inline),
                  file_property_inline: /\bfile\s*:/i.test(inline),
                  playerjsfile_node: !!document.querySelector('#playerjsfile'),
                  playlists_node: !!document.querySelector('#playlists'),
                  player_container: !!document.querySelector('#videoplayer, #player, .player'),
                  video_elements: document.querySelectorAll('video').length,
                  iframe_elements: document.querySelectorAll('iframe').length,
                  alert_present: !!document.querySelector('.alert'),
                  geo_notice: /недоступно\s+(?:в|для)\s+(?:ваш|регион|стран)|географическ|not available in your (?:country|region)|geo.block/i.test(text)
                };
              });
              console.log('DOM ' + JSON.stringify(summary));
              const notices = await page.locator('.alert').allTextContents();
              console.log('alert_count=' + notices.length);
              for (const notice of notices.slice(0, 8)) console.log('alert_text=' + JSON.stringify(safeNotice(notice)));
              console.log('page_title=' + JSON.stringify(safeNotice(await page.title())));
              await Promise.race([Promise.allSettled(pending), new Promise(resolve => setTimeout(resolve, 5000))]);
              for (const entry of xhrDetails) console.log('xhr_detail ' + JSON.stringify(entry));
              console.log('page_errors=' + pageErrors);
              for (const [key, count] of counts) console.log('network ' + key + ' count=' + count);
              if (!navigation || navigation.status() !== 200) process.exitCode = 1;
              else console.log('PASS: live browser observation; playback and regional access not validated');
            } catch (e) {
              console.error('browser_diagnostic_error=' + (e?.name || 'Error'));
              for (const [key, count] of counts) console.log('network ' + key + ' count=' + count);
              process.exitCode = 1;
            } finally {
              if (browser) await browser.close();
            }
          }
          main();
          JS
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kinobase-http-browser-diagnostics
          path: diagnostics/
          retention-days: 14
  proxy-connectivity:
    name: Public proxy connectivity (neutral endpoint)
    runs-on: ubuntu-26.04
    timeout-minutes: 4
    permissions: {}
    steps:
      - name: Test HTTPS connectivity and reported country
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          endpoint='https://www.cloudflare.com/cdn-cgi/trace'
          working=0
          test_proxy() {
            local label="$1"
            shift
            local meta rc country
            rc=0
            meta="$(curl --silent --show-error --fail \
              --connect-timeout 6 --max-time 15 --max-filesize 8192 \
              --proto '=https' --output "$work/body" \
              --write-out '%{http_code} %{ssl_verify_result} %{time_total}' \
              "$@" "$endpoint" 2>"$work/error")" || rc=$?
            if [[ "$rc" -ne 0 ]]; then
              printf '%s: curl_exit=%s http_tls_seconds=%s\n' "$label" "$rc" "$meta"
              return 1
            fi
            country="$(awk -F= '$1=="loc" && $2 ~ /^[A-Z][A-Z]$/ {print $2; exit}' "$work/body")"
            printf '%s: http_tls_seconds=%s reported_country=%s\n' "$label" "$meta" "${country:-unknown}"
            [[ "$meta" == '200 0 '* && -n "$country" ]]
          }
          test_proxy direct --noproxy '*' --proxy '' || true
          for candidate in 116.204.166.199:8080 188.132.249.148:8080 5.26.111.181:8080; do
            if test_proxy "$candidate" --noproxy '' --proxy "http://$candidate"; then
              working=$((working + 1))
            fi
          done
          echo "HTTPS connectivity verified: $working/3"
          echo 'No requests to Kinobase or media endpoints through proxies.'
          [[ "$working" -gt 0 ]]
