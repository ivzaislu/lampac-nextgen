name: Quality module checks

on:
  push:
    branches:
      - feature/qulity-lampa-module
    paths:
      - 'Modules/Quality/**'
      - '!Modules/Quality/PLAN.md'
      - '!Modules/Quality/README.md'
      - 'tests/quality-client.test.js'
      - 'tests/quality-cache-client.test.js'
      - 'tests/quality-autoinject/**'
      - 'NextGen.slnx'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'Modules/Quality/**'
      - '!Modules/Quality/PLAN.md'
      - '!Modules/Quality/README.md'
      - 'tests/quality-client.test.js'
      - 'tests/quality-autoinject/**'
      - 'NextGen.slnx'
      - '.github/workflows/quality.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Check module manifest and files
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("Modules/Quality")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["dynamic"] is True
          assert manifest["enable"] is True, "Quality must be enabled in the test-ready branch"
          for path in manifest["tree"]:
              assert (root / path).is_file(), path
          assert 'Modules/Quality/Quality.csproj' in Path("NextGen.slnx").read_text()
          print("Quality manifest and solution: OK")
          PY

      - name: Build Quality module
        run: dotnet build Modules/Quality/Quality.csproj --configuration Release --nologo

      - name: Verify native LampaWeb auto-injection
        run: dotnet run --project tests/quality-autoinject/QualityAutoinject.csproj --configuration Release --nologo

      - name: Check Lampa plugin syntax
        run: node --check Modules/Quality/plugin.js

      - name: Run client quality regression checks
        run: |
          node tests/quality-client.test.js
          node tests/quality-cache-client.test.js

      - name: Publish Lampac for dynamic module smoke
        run: dotnet publish Core/Core.csproj --configuration Release --output /tmp/lampac-quality-smoke --nologo -p:PlaywrightPlatform=linux-x64

      - name: Check dynamic load and HTTP plugin endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('/tmp/lampac-quality-smoke/module/Quality/manifest.json')
          assert manifest.is_file(), 'Quality was not published'
          value = json.loads(manifest.read_text())
          assert value['enable'] is True, 'Quality must load with its shipped manifest'
          assert Path('/tmp/lampac-quality-smoke/module/Quality/plugin.js').is_file()
          PY
          cat > /tmp/lampac-quality-smoke/init.yaml <<'YAML'
          chromium:
            enable: false
          firefox:
            enable: false
          rch:
            enable: false
          cache:
            type: mem
          accsdb:
            enable: false
          BaseModule:
            LoadModules:
              - Quality
          listen:
            port: 9118
          YAML
          printf '%s\n' '{"Quality":{"enable":true}}' >/tmp/lampac-quality-smoke/init.conf
          (cd /tmp/lampac-quality-smoke && exec dotnet Core.dll >/tmp/lampac-quality-smoke.log 2>&1) &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          found=0
          for i in $(seq 1 180); do
            if curl -fsS --max-time 2 http://127.0.0.1:9118/quality.js >/tmp/quality-serve.js 2>/dev/null; then
              found=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -n 200 /tmp/lampac-quality-smoke.log
              exit 1
            fi
            sleep 0.5
          done
          if [ "$found" -ne 1 ]; then
            tail -n 200 /tmp/lampac-quality-smoke.log
            exit 1
          fi
          node --check /tmp/quality-serve.js
          grep -Fq 'L.Parser.get(' /tmp/quality-serve.js
          curl -fsS --max-time 3 http://127.0.0.1:9118/quality/status > /tmp/quality-status.json
          python3 - <<'PY'
          import json
          with open('/tmp/quality-status.json', encoding='utf-8') as fp:
              status = json.load(fp)
          assert status['module'] == 'Quality'
          assert status['loaded'] is True
          assert status['enabled'] is True
          assert status['autoinject'] is True
          assert status['sqlcache'] is True
          PY
          curl -fsS --max-time 5 -X POST -H 'Content-Type: application/json' \
            --data '{"op":"put","scope":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","source":"aaaaaaaaaaaaaaaa","movie":"bbbbbbbbbbbbbbbb","label":"4K"}' \
            http://127.0.0.1:9118/quality/cache > /tmp/quality-cache-put.json
          curl -fsS --max-time 5 -X POST -H 'Content-Type: application/json' \
            --data '{"op":"get","scope":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","source":"aaaaaaaaaaaaaaaa","movie":"bbbbbbbbbbbbbbbb"}' \
            http://127.0.0.1:9118/quality/cache > /tmp/quality-cache-get.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('/tmp/quality-cache-put.json').read_text())['saved'] is True
          cached=json.loads(Path('/tmp/quality-cache-get.json').read_text())
          assert cached['hit'] is True and cached['label']=='4K'
          assert Path('/tmp/lampac-quality-smoke/database/quality-cache.db').is_file()
          PY
          curl -fsS --max-time 5 -X POST -H 'Content-Type: application/json' \
            --data '{"op":"get","scope":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","source":"aaaaaaaaaaaaaaaa","movie":"bbbbbbbbbbbbbbbb"}' \
            http://127.0.0.1:9118/quality/cache > /tmp/quality-cache-isolation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          isolation=json.loads(Path('/tmp/quality-cache-isolation.json').read_text())
          print('SQLite isolation response:', isolation)
          assert isolation.get('hit') is False, 'Different SQL scope must produce a cache miss'
          PY
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            --data '{"op":"put","scope":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","source":"aaaaaaaaaaaaaaaa","movie":"bbbbbbbbbbbbbbbb","label":"FAKE"}' \
            http://127.0.0.1:9118/quality/cache)
          [ "$code" = 400 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -H 'Origin: https://evil.example.invalid' \
            --data '{"op":"get","scope":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","source":"aaaaaaaaaaaaaaaa","movie":"bbbbbbbbbbbbbbbb"}' \
            http://127.0.0.1:9118/quality/cache)
          [ "$code" = 403 ]
          echo "Quality runtime plugin, status and SQLite cache: OK"
