name: Quality module checks

on:
  push:
    branches:
      - feature/qulity-lampa-module
    paths:
      - 'Modules/Quality/**'
      - 'NextGen.slnx'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'Modules/Quality/**'
      - 'NextGen.slnx'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Check module manifest and files
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("Modules/Quality")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["dynamic"] is True
          assert manifest["enable"] is False, "Quality must remain disabled until runtime verification"
          for path in manifest["tree"]:
              assert (root / path).is_file(), path
          assert 'Modules/Quality/Quality.csproj' in Path("NextGen.slnx").read_text()
          print("Quality manifest and solution: OK")
          PY

      - name: Build Quality module
        run: dotnet build Modules/Quality/Quality.csproj --configuration Release --nologo

      - name: Check Lampa plugin syntax
        run: node --check Modules/Quality/plugin.js

      - name: Run client quality regression checks
        run: node tests/quality-client.test.js

      - name: Publish Lampac for dynamic module smoke
        run: dotnet publish Core/Core.csproj --configuration Release --output /tmp/lampac-quality-smoke --nologo -p:PlaywrightPlatform=linux-x64

      - name: Check dynamic load and HTTP plugin endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('/tmp/lampac-quality-smoke/module/Quality/manifest.json')
          assert manifest.is_file(), 'Quality was not published'
          value = json.loads(manifest.read_text())
          value['enable'] = True  # CI-only: working-branch manifest remains disabled
          manifest.write_text(json.dumps(value))
          assert Path('/tmp/lampac-quality-smoke/module/Quality/plugin.js').is_file()
          PY
          cat > /tmp/lampac-quality-smoke/init.yaml <<'YAML'
          chromium:
            enable: false
          firefox:
            enable: false
          rch:
            enable: false
          cache:
            type: mem
          accsdb:
            enable: false
          BaseModule:
            LoadModules:
              - Quality
          listen:
            port: 9118
          YAML
          printf '%s\n' '{"Quality":{"enable":true}}' >/tmp/lampac-quality-smoke/init.conf
          (cd /tmp/lampac-quality-smoke && exec dotnet Core.dll >/tmp/lampac-quality-smoke.log 2>&1) &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          found=0
          for i in $(seq 1 180); do
            if curl -fsS --max-time 2 http://127.0.0.1:9118/quality.js >/tmp/quality-serve.js 2>/dev/null; then
              found=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -n 200 /tmp/lampac-quality-smoke.log
              exit 1
            fi
            sleep 0.5
          done
          if [ "$found" -ne 1 ]; then
            tail -n 200 /tmp/lampac-quality-smoke.log
            exit 1
          fi
          node --check /tmp/quality-serve.js
          grep -Fq 'L.Parser.get(' /tmp/quality-serve.js
          echo "Quality runtime plugin route: OK"
