name: Cinemar diagnostic baseline
on:
  push:
    branches: [cinemar]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Environment and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            git rev-parse HEAD
            dotnet --info
            uname -a
            free -m
          } | tee diagnostics/environment.log
          dotnet build Modules/OnlineRUS/Cinemar/Cinemar.csproj -c Release --verbosity normal 2>&1 | tee diagnostics/cinemar-build.log
          dotnet publish Core/Core.csproj -c Release -o publish --verbosity normal 2>&1 | tee diagnostics/lampac-publish.log
      - name: Live Cinemar smoke test (Playwright baseline)
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome" --version | tee diagnostics/chromium.log
          jq -n --arg chrome "$chrome" '{
            listen: {ip: "127.0.0.1", port: 9118, ResponseCancelAfter: 90},
            BaseModule: {LoadModules: ["Cinemar"], SkipModules: []},
            chromium: {enable: true, Headless: true, executablePath: $chrome},
            firefox: {enable: false, Headless: true},
            rch: {enable: false},
            Cinemar: {enable: true, enabled: true, rhub: false, httptimeout: 30}
          }' > publish/init.conf
          test -f publish/module/OnlineRUS/Cinemar/manifest.json
          test -f publish/.playwright/package/index.js
          export CINEMAR_DIAGNOSTICS=1
          (cd publish && exec dotnet Core.dll) > diagnostics/lampac-live.log 2>&1 &
          pid=$!
          trap 'rc=$?; if (( rc != 0 )); then tail -n 100 diagnostics/lampac-live.log; fi; kill "$pid" 2>/dev/null || true' EXIT
          base=http://127.0.0.1:9118
          for i in $(seq 1 90); do
            kill -0 "$pid"
            if curl -fsS --max-time 2 "$base/version" >/dev/null 2>&1 && grep -Eq 'Chromium: v.* / headless / True' diagnostics/lampac-live.log; then
              break
            fi
            sleep 2
          done
          grep -Eq 'Chromium: v.* / headless / True' diagnostics/lampac-live.log
          curl -fsS --max-time 5 "$base/version" >/dev/null
          grep -F "compilation Cinemar" diagnostics/lampac-live.log

          # Exercise the real module with an actual search, no injected HTML or cache.
          tmp="$(mktemp -d)"
          trap 'rc=$?; if (( rc != 0 )); then tail -n 100 diagnostics/lampac-live.log; fi; kill "$pid" 2>/dev/null || true; rm -rf "$tmp"' EXIT
          # Independent HTTP observation, never substitutes for the real module test.
          upstream="$(python3 -c 'from urllib.parse import quote; print("https://kinogo.luxury/search/" + quote("Ночь живых мертвецов"))')"
          curl -sS --max-time 30 -L "$upstream" -o "$tmp/upstream.html" \
            -w 'direct HTTP: %{http_code}, %{content_type}, %{time_total}s, %{size_download} bytes\n' | tee -a diagnostics/live-test.log || true
          if [[ -f "$tmp/upstream.html" ]]; then
            python3 -c 'import sys; b=open(sys.argv[1],"rb").read().lower(); print("direct HTML: shortstory=%d iframe=%d" % (b.count(b"shortstory"), b.count(b"<iframe")))' "$tmp/upstream.html" | tee -a diagnostics/live-test.log
          fi
          curl -fsS --max-time 90 -G "$base/lite/cinemar" \
            --data-urlencode 'title=Ночь живых мертвецов' \
            --data-urlencode 'year=1968' \
            --data-urlencode 'rjson=true' \
            --data-urlencode 'similar=true' \
            -o "$tmp/search.json" -w 'search: HTTP %{http_code}, %{time_total}s, %{size_download} bytes\n' | tee -a diagnostics/live-test.log
          jq -e '.type == "similar" and (.data | type == "array" and length > 0)' "$tmp/search.json" >/dev/null
          jq '{type, count: (.data | length)}' "$tmp/search.json" | tee -a diagnostics/live-test.log

          curl -fsS --max-time 90 -G "$base/lite/cinemar" \
            --data-urlencode 'title=Ночь живых мертвецов' \
            --data-urlencode 'year=1968' \
            --data-urlencode 'rjson=true' \
            -o "$tmp/movie.json" -w 'playlist: HTTP %{http_code}, %{time_total}s, %{size_download} bytes\n' | tee -a diagnostics/live-test.log
          jq -e '.type == "movie" and (.data | type == "array" and length > 0)' "$tmp/movie.json" >/dev/null
          jq '{type, count: (.data | length), methods: [.data[].method]}' "$tmp/movie.json" | tee -a diagnostics/live-test.log
          video="$(jq -er '[.data[] | select(.method == "call") | .url | select(type == "string" and contains("/lite/cinemar/video?"))][0]' "$tmp/movie.json")"
          # Only follow the local module's own video endpoint.
          [[ "$video" == "$base/lite/cinemar/video?"* ]]
          curl -fsS --max-time 90 "$video" -o "$tmp/video.json" \
            -w 'video API: HTTP %{http_code}, %{time_total}s, %{size_download} bytes\n' | tee -a diagnostics/live-test.log
          jq -e '.method == "play" and (.url | type == "string" and length > 0)' "$tmp/video.json" >/dev/null
          jq '{method, qualities: ((.quality // {}) | keys), subtitles: ((.subtitles // []) | length)}' "$tmp/video.json" | tee -a diagnostics/live-test.log
          echo 'PASS: live search, playlist and video API' | tee -a diagnostics/live-test.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cinemar-baseline-diagnostics
          path: diagnostics/
          retention-days: 14
