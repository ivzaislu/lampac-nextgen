name: VkSeries compilation probe

on:
  push:
    branches:
      - vkseries-global-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Probe whole-season videos
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ID=52461373
          API=https://api.vkvideo.ru/method
          V=5.264

          token_json="$(curl -fsS --retry 2 --connect-timeout 10 --max-time 30             -X POST 'https://login.vk.com/?act=get_anonym_token'             --data-urlencode "client_id=$CLIENT_ID")"
          TOKEN="$(jq -r '.data.access_token // empty' <<<"$token_json")"
          test -n "$TOKEN"

          call_api() {
            local method="$1"; shift
            curl -fsS --retry 2 --connect-timeout 10 --max-time 30               -X POST "$API/$method?v=$V&client_id=$CLIENT_ID"               --data-urlencode "access_token=$TOKEN" "$@"
          }

          for q in             'Симпсоны 1 сезон'             'Симпсоны 5 сезон'             'Южный парк 1 сезон'             'Южный парк 10 сезон'             'The Simpsons season 1'             'South Park season 1'; do

            echo "===== $q ====="
            j="$(call_api catalog.getVideoSearchWeb2               --data-urlencode 'screen_ref=search_video_service'               --data-urlencode 'input_method=keyboard_search_button'               --data-urlencode "q=$q"               --data-urlencode 'extended=1'               --data-urlencode 'count=50')"

            jq '{
              albums:[(.response.albums // [])[:12][]? | {id,owner_id,title,count}],
              videos:[(.response.catalog_videos // [])[:35][]?.video | {
                owner_id,id,title,duration,owner_name,
                has_files:(.files != null)
              }]
            }' <<<"$j"
          done

          echo '===== Probe discovered owner albums ====='
          for owner in -209745116 -199103112 -102553865 -240197792; do
            echo "===== OWNER $owner ====="
            j="$(call_api video.getAlbums               --data-urlencode "owner_id=$owner"               --data-urlencode 'extended=1'               --data-urlencode 'need_system=0'               --data-urlencode 'count=100'               --data-urlencode 'offset=0')"
            jq '{
              count:(.response.count // null),
              albums:[(.response.items // [])[:100][]? | {id,owner_id,title,count,updated_time}]
            }' <<<"$j"
          done

          echo '===== Probe known good episode albums ====='
          for pair in '-209745116 10' '-93951483 1' '-240197792 1' '-199103112 1'; do
            read -r owner album <<<"$pair"
            echo "===== ALBUM $owner $album ====="
            j="$(call_api video.getFromAlbum               --data-urlencode "owner_id=$owner"               --data-urlencode "album_id=$album"               --data-urlencode 'extended=1'               --data-urlencode 'count=50')"
            jq '{
              count:(.response.count // null),
              items:[(.response.items // [])[:30][]? | {
                playlist_position,
                video:{
                  owner_id:.video.owner_id,
                  id:.video.id,
                  title:.video.title,
                  duration:.video.duration,
                  has_files:(.video.files != null)
                }
              }]
            }' <<<"$j"
          done
