name: VkSeries API probe

on:
  push:
    branches:
      - vkseries-api-probe-20260925
  pull_request:
    branches:
      - VkSeries
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe VK Video discovery APIs
        shell: bash
        run: |
          set -euo pipefail

          CLIENT_ID=52461373
          API=https://api.vkvideo.ru/method

          token_json="$(curl -fsS --retry 2 --connect-timeout 10 --max-time 30             -X POST 'https://login.vk.com/?act=get_anonym_token'             --data-urlencode 'client_secret=o557NLIkAErNhakXrQ7A'             --data-urlencode "client_id=$CLIENT_ID"             --data-urlencode 'scopes=audio_anonymous,video_anonymous,photos_anonymous,profile_anonymous'             --data-urlencode 'isApiOauthAnonymEnabled=false'             --data-urlencode 'version=1'             --data-urlencode 'app_id=6287487')"

          TOKEN="$(jq -r '.data.access_token // empty' <<<"$token_json")"
          if [[ -z "$TOKEN" ]]; then
            echo "Anonymous token acquisition failed"
            jq '{keys: keys, data_keys: (.data // {} | keys), error: .error}' <<<"$token_json"
            exit 1
          fi
          echo "Anonymous token acquired; token is intentionally not printed."

          call_api() {
            local method="$1"; shift
            curl -fsS --retry 2 --connect-timeout 10 --max-time 30               -X POST "$API/$method?v=5.264&client_id=$CLIENT_ID"               --data-urlencode "access_token=$TOKEN"               "$@"
          }

          for q in "Мажор" "Кухня" "Триггер"; do
            echo
            echo "================ QUERY: $q ================"

            catalog="$(call_api catalog.getVideoSearchWeb2               --data-urlencode 'screen_ref=search_video_service'               --data-urlencode 'input_method=keyboard_search_button'               --data-urlencode "q=$q")"

            echo "-- catalog.getVideoSearchWeb2 summary --"
            jq '{
              error: .error,
              response_keys: (.response // {} | keys),
              catalog_count: ((.response.catalog_videos // []) | length),
              videos: [(.response.catalog_videos // [])[:12][]?.video | {
                owner_id,id,title,duration,owner_name,
                keys: keys,
                has_files: (.files != null),
                quality: {
                  p2160: (.files.mp4_2160 != null),
                  p1440: (.files.mp4_1440 != null),
                  p1080: (.files.mp4_1080 != null),
                  p720: (.files.mp4_720 != null),
                  hls: (.files.hls != null or .files.hls_fmp4 != null)
                }
              }]
            }' <<<"$catalog"

            echo "-- catalog paths mentioning album/series/playlist --"
            jq '[paths as $p
                 | select(($p | map(tostring) | join(".") | test("album|series|playlist"; "i")))
                 | ($p | map(tostring) | join("."))] | unique | .[:200]' <<<"$catalog"

            search="$(call_api video.search               --data-urlencode "q=$q"               --data-urlencode 'count=20'               --data-urlencode 'extended=1'               --data-urlencode 'sort=2')"

            echo "-- video.search summary --"
            jq '{
              error: .error,
              count: (.response.count // null),
              items: [(.response.items // [])[:12][]? | {
                owner_id,id,title,duration,owner_name,
                keys: keys,
                has_files: (.files != null)
              }]
            }' <<<"$search"

            mapfile -t pairs < <(jq -r '
              [(.response.catalog_videos // [])[]?.video
               | select(.owner_id != null and .id != null)
               | "\(.owner_id) \(.id)"]
              | unique | .[:8][]' <<<"$catalog")

            declare -A seen_owner=()
            for pair in "${pairs[@]}"; do
              read -r owner video <<<"$pair"

              echo "-- video.getAlbumsByVideo owner=$owner video=$video target=$owner --"
              gav="$(call_api video.getAlbumsByVideo                 --data-urlencode "target_id=$owner"                 --data-urlencode "owner_id=$owner"                 --data-urlencode "video_id=$video"                 --data-urlencode 'extended=1' || true)"
              if [[ -n "$gav" ]]; then
                jq '{error:.error,response:.response}' <<<"$gav"
              fi

              if [[ -z "${seen_owner[$owner]+x}" ]]; then
                seen_owner[$owner]=1
                echo "-- video.getAlbums owner=$owner --"
                albums="$(call_api video.getAlbums                   --data-urlencode "owner_id=$owner"                   --data-urlencode 'count=100'                   --data-urlencode 'offset=0'                   --data-urlencode 'extended=1'                   --data-urlencode 'need_system=0' || true)"
                if [[ -n "$albums" ]]; then
                  jq --arg q "$q" '{
                    error:.error,
                    count:(.response.count // null),
                    albums:[(.response.items // [])[:50][]? | {
                      id,owner_id,title,count,type,updated_time,
                      title_matches: (.title // "" | ascii_downcase | contains($q|ascii_downcase))
                    }]
                  }' <<<"$albums"
                fi
              fi
            done
            unset seen_owner
          done
