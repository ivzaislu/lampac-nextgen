name: VkSeries hardening verification

on:
  push:
    branches:
      - vkseries-global-clean-20260925
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}

      - name: Build VkSeries
        run: dotnet build Modules/OnlineRUS/VkSeries/VkSeries.csproj --configuration Release --verbosity minimal

      - name: Run edge cases and live direct audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/VkSeriesHardening

          cat >.tmp/VkSeriesHardening/Probe.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <OutputType>Exe</OutputType>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../Modules/OnlineRUS/VkSeries/VkSeries.csproj" />
            </ItemGroup>
          </Project>
          EOF

          cat >.tmp/VkSeriesHardening/Program.cs <<'EOF'
          using System.Collections;
          using System.Reflection;
          using System.Text.Json;
          using Shared.Services.Utilities;
          using VkSeries;

          var controller=typeof(VkSeriesController);
          var parseM=controller.GetMethod("ParseVideos",BindingFlags.Static|BindingFlags.NonPublic)!;
          var directM=controller.GetMethod("ParseTrustedDirectVideos",BindingFlags.Static|BindingFlags.NonPublic)!;
          var buildQueriesM=controller.GetMethod("BuildSearchQueries",BindingFlags.Static|BindingFlags.NonPublic)!;

          Video V(string title,long duration,int id=1)=>new(){
              owner_id=-1,id=id,title=title,duration=duration,
              files=new VideoFiles{mp4_720="https://example.invalid/a.mp4"}
          };

          List<(short season,short episode,Video video)> Read(object? value)
          {
              var r=new List<(short,short,Video)>();
              foreach(var item in (IEnumerable?)value??Array.Empty<object>())
              {
                  if(item is null)continue;
                  var t=item.GetType();
                  var s=(short)(t.GetProperty("season")?.GetValue(item)??(short)0);
                  var e=(short)(t.GetProperty("episode")?.GetValue(item)??(short)0);
                  var v=(Video?)t.GetProperty("video")?.GetValue(item);
                  if(v!=null)r.Add((s,e,v));
              }
              return r;
          }

          List<(short,short,Video)> Parse(short hint,params Video[] videos)=>
              Read(parseM.Invoke(null,new object?[]{videos,hint}));

          List<(short,short,Video)> Direct(string title,short year,short hint,params Video[] videos)
          {
              string st=SearchNameTo.Convert(title)??"";
              return Read(directM.Invoke(null,new object?[]{videos,st,"",year,hint}));
          }

          void ExpectEmpty(string name,IEnumerable<(short,short,Video)> rows)
          {
              var a=rows.ToList();
              if(a.Count!=0)throw new Exception($"{name}: expected empty, got {a.Count}");
              Console.WriteLine($"PASS {name}");
          }

          void ExpectCount(string name,IEnumerable<(short,short,Video)> rows,int count)
          {
              var a=rows.ToList();
              if(a.Count!=count)throw new Exception($"{name}: expected {count}, got {a.Count}");
              Console.WriteLine($"PASS {name}: {count}");
          }

          ExpectEmpty("announcement is noise", Parse(1,V("Физрук: сезон 1, серия 12 (АНОНС)",30)));
          ExpectEmpty("promo is noise", Parse(1,V("Show S01E03 promo",40)));
          ExpectEmpty("preview is noise", Parse(1,V("Show S01E04 preview",45)));
          ExpectEmpty("multi-hour fake episode rejected", Parse(1,V("Воронины 1 Сезон 8 Серии",13694)));

          ExpectEmpty(
              "sparse unrelated direct set rejected",
              Direct("Реальные пацаны",2010,1,
                  V("Реальные пацаны 1 сезон 2 серия. Blue Mountain State",1271,2),
                  V("Реальные пацаны 1 сезон 4 серия. Blue Mountain State",1294,4),
                  V("Реальные пацаны 1 сезон 5 серия. Blue Mountain State",1292,5),
                  V("Реальные пацаны 1 сезон 13 серия. Blue Mountain State",1293,13))
          );

          ExpectEmpty(
              "short direct clips rejected",
              Direct("Физрук",2014,2,
                  V("Физрук 2 сезон 1 серия",95,1),
                  V("Физрук 2 сезон 2 серия",80,2),
                  V("Физрук 2 сезон 3 серия",90,3))
          );

          ExpectCount(
              "dense full direct set accepted",
              Direct("Физрук",2014,2,
                  V("Физрук 2 сезон 1 серия",1500,1),
                  V("Физрук 2 сезон 2 серия",1510,2),
                  V("Физрук 2 сезон 3 серия",1490,3)),
              3
          );

          var shows=new (string title,short year)[]{
              ("Интерны",2010),("Универ",2008),("Воронины",2009),("Молодёжка",2013),
              ("Физрук",2014),("Полицейский с Рублёвки",2016),("Ивановы-Ивановы",2017),
              ("Отель Элеон",2016),("Реальные пацаны",2010),("Папины дочки",2007)
          };

          using var http=new HttpClient{Timeout=TimeSpan.FromSeconds(30)};
          const int clientId=52461373;
          const string api="https://api.vkvideo.ru/method";
          const string ver="5.264";

          string authJson=await Post($"{api}/auth.getAnonymToken?v={ver}&client_id={clientId}",new());
          using var auth=JsonDocument.Parse(authJson);
          string token=auth.RootElement.GetProperty("response").GetProperty("token").GetString()!;

          foreach(var show in shows)
          {
              var all=new List<Video>();

              foreach(short season in Enumerable.Range(1,4).Select(x=>(short)x))
              {
                  var queries=(IEnumerable<string>?)buildQueriesM.Invoke(
                      null,new object?[]{show.title,"",show.year,season,false})
                      ?? Array.Empty<string>();

                  foreach(var q in queries)
                  {
                      var root=await Search(q);
                      if(root?.response?.catalog_videos==null)continue;
                      all.AddRange(root.response.catalog_videos
                          .Where(x=>x?.video!=null)
                          .Select(x=>x.video));
                  }
              }

              all=all.Where(x=>x!=null&&x.id>0&&x.owner_id!=0)
                  .GroupBy(x=>$"{x.owner_id}:{x.id}")
                  .Select(g=>g.First()).ToList();

              string st=SearchNameTo.Convert(show.title)??"";
              var trusted=Read(directM.Invoke(null,new object?[]{all,st,"",show.year,(short)0}));

              bool noisy=trusted.Any(x=>{
                  string z=(x.video.title+" "+x.video.description).ToLowerInvariant();
                  return z.Contains("трейлер")||z.Contains("тизер")||z.Contains("анонс")||
                         z.Contains("trailer")||z.Contains("teaser")||z.Contains("promo")||
                         z.Contains("preview");
              });

              var groups=trusted.GroupBy(x=>x.season).Where(g=>g.Key>0)
                  .OrderBy(g=>g.Key)
                  .Select(g=>new{
                      season=g.Key,
                      count=g.Select(x=>x.episode).Distinct().Count(),
                      first=g.Min(x=>x.episode),
                      last=g.Max(x=>x.episode),
                      samples=g.OrderBy(x=>x.episode).Take(3).Select(x=>x.video.title).ToArray()
                  }).ToArray();

              Console.WriteLine(JsonSerializer.Serialize(new{
                  kind="show",show=show.title,raw=all.Count,noisy,
                  seasons=groups
              }));

              if(noisy)throw new Exception($"{show.title}: noisy direct episode survived");
          }

          async Task<Root?> Search(string q)
          {
              string json=await Post($"{api}/catalog.getVideoSearchWeb2?v={ver}&client_id={clientId}",new(){
                  ["access_token"]=token,["screen_ref"]="search_video_service",
                  ["input_method"]="keyboard_search_button",["extended"]="1",["count"]="50",["q"]=q
              });
              return JsonSerializer.Deserialize<Root>(json,new JsonSerializerOptions{PropertyNameCaseInsensitive=true});
          }

          async Task<string> Post(string url,Dictionary<string,string> form)
          {
              using var res=await http.PostAsync(url,new FormUrlEncodedContent(form));
              return await res.Content.ReadAsStringAsync();
          }
          EOF

          dotnet run --project .tmp/VkSeriesHardening/Probe.csproj --configuration Release
