name: TranslationSub Background Refresh Simulation

on:
  push:
    branches:
      - TranslationSub-clean-legacy-api
    paths:
      - 'Modules/TranslationSub/translationsub.js'
      - 'Modules/TranslationSub/translationsub-watch.js'
      - 'Modules/TranslationSub/translationsub-badge-state.js'
      - 'Modules/TranslationSub/Controller.cs'
      - 'scripts/ci/translationsub-background-refresh-simulation.mjs'
      - '.github/workflows/translationsub-background-refresh-simulation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate-background-refresh:
    name: Simulate background refresh ownership
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run background refresh simulation
        run: node scripts/ci/translationsub-background-refresh-simulation.mjs
