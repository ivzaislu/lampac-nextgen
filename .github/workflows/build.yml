name: Build

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Tag name for release builds"
        required: false
        type: string
      checkout_ref:
        description: "Git ref to checkout (e.g., refs/tags/1.0.0)"
        required: false
        type: string

# PR/fork baseline: read-only. Write jobs elevate permissions below.
permissions:
  contents: read
  actions: read
  packages: read

jobs:
  extract-version:
    name: Extract version
    permissions:
      actions: read
    uses: ./.github/workflows/reusable-extract-version.yml
    with:
      tag: ${{ inputs.tag }}
      checkout_ref: ${{ inputs.checkout_ref }}
    secrets: inherit

  build:
    name: .NET build
    needs: extract-version
    uses: ./.github/workflows/reusable-build.yml
    with:
      # Pin the build to the exact dispatch commit, even if the dev branch moves.
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/dev/feature/') || startsWith(github.ref, 'refs/heads/dev/fix/')) && github.sha || needs.extract-version.outputs.checkout_ref }}
      dotnet_version: ${{ vars.DOTNET_VERSION || '10.0.x' }}
      retention_days: ${{ needs.extract-version.outputs.is_release == 'true' && 30 || 7 }}
    secrets: inherit

  # push/attest stay false on pull_request refs; write perms only used when push is true.
  build-docker-image:
    name: Build and push Docker image
    # Dev workflow_dispatch builds a separate, SHA-addressed test image below.
    # Skip this second multi-architecture Docker build for those requests.
    if: ${{ !(github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/dev/feature/') || startsWith(github.ref, 'refs/heads/dev/fix/'))) }}
    needs: extract-version
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      image: ${{ vars.IMAGE_NAME || 'lampac' }}
      version: ${{ needs.extract-version.outputs.version }}
      tag_latest: ${{ needs.extract-version.outputs.tag_latest }}
      checkout_ref: ${{ needs.extract-version.outputs.checkout_ref }}
      push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
      attest_github: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
      sbom: true
      provenance: "mode=max"
      generate_syft_sbom: true
      sbom_artifact_retention_days: ${{ (inputs.tag != '' || startsWith(github.ref, 'refs/tags/')) && 30 || 7 }}
    secrets: inherit

  build-mcp-test-image:
    name: Build isolated MCP test image and record digest
    # This job is intentionally self-contained: reusing the release Docker
    # workflow would demand its broader contents/attestation permissions.
    if: ${{ github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/dev/feature/') || startsWith(github.ref, 'refs/heads/dev/fix/')) }}
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/lampac-mcp-test
    steps:
      - name: Checkout exact dispatched commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SHA-only test image
        id: docker
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.TEST_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            LAMPAC_VERSION=dev
            GIT_COMMIT=${{ github.sha }}
            GITHUB_SERVER_URL=${{ github.server_url }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_REF=${{ github.ref }}
            GITHUB_RUN_ID=${{ github.run_id }}
          sbom: false
          provenance: mode=min

      - name: Verify digest and write deployment receipt
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_REPO: ${{ env.TEST_IMAGE }}
          IMAGE_DIGEST: ${{ steps.docker.outputs.digest }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n \
            --arg commit "$SOURCE_SHA" \
            --arg image "$IMAGE_REPO" \
            --arg digest "$IMAGE_DIGEST" \
            --arg run "$WORKFLOW_RUN" \
            '{
              schema_version: 1,
              source_sha: $commit,
              image: $image,
              digest: $digest,
              image_ref: ($image + "@" + $digest),
              tag_ref: ($image + ":sha-" + $commit),
              platform: "linux/amd64",
              workflow_run_id: $run
            }' > lampac-mcp-test-image.json

      - name: Upload test-image deployment receipt
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lampac-mcp-image-${{ github.sha }}
          path: lampac-mcp-test-image.json
          retention-days: 7

  upload-release-assets:
    name: Attach artifacts to release
    permissions:
      contents: write
    needs:
      - extract-version
      - build
    if: needs.extract-version.outputs.is_release == 'true'
    uses: ./.github/workflows/reusable-upload-release-assets.yml
    with:
      tag: ${{ needs.extract-version.outputs.release_tag }}
      artifact_pattern: "lampac-nextgen"
    secrets: inherit
