name: TranslationSub Full Functional Regression

on:
  push:
    branches:
      - TranslationSub-release
    paths:
      - 'Modules/TranslationSub/**'
      - 'Modules/Sync/TimeCode/**'
      - 'scripts/ci/translationsub-full-regression.sh'
      - '.github/workflows/translationsub-full-regression.yml'
  pull_request:
    paths:
      - 'Modules/TranslationSub/**'
      - 'Modules/Sync/TimeCode/**'
      - 'scripts/ci/translationsub-full-regression.sh'
      - '.github/workflows/translationsub-full-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translationsub-full-functional-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-functional-regression:
    name: Build + API + SQLite + TimeCode + faults + realtime
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Adapt pinned architecture harness to current APIs
        shell: bash
        run: |
          set -euo pipefail
          echo "REAL_NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
          mkdir -p /tmp/translationsub-node-wrapper
          cat > /tmp/translationsub-node-wrapper/node <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "scripts/ci/translationsub-backend-driven-simulation.mjs" ] && [ -f "${1:-}" ]; then
            python3 - "$1" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          replacements = {
              r'ProfileProgressStore\.Upsert\(uid, profileId, watchedBySubscription\)':
                  r'ProfileProgressStore\.(?:Upsert|Reconcile)\(uid, profileId, watchedBySubscription\)',
              r'beforePersisted[\s\S]*?PersistedState\(list\)[\s\S]*?StringComparison\.Ordinal[\s\S]*?return;':
                  r'(?:beforePersisted[\s\S]*?PersistedState\(list\)[\s\S]*?StringComparison\.Ordinal|SameSnapshot\(before, after\))[\s\S]*?return;',
              r'SaveUnsafe\(list\)':
                  r'SaveUnsafe\(list(?:, before, after)?\)',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          fi
          exec "$REAL_NODE_BIN" "$@"
          SH
          chmod +x /tmp/translationsub-node-wrapper/node
          echo '/tmp/translationsub-node-wrapper' >> "$GITHUB_PATH"

      - name: Run complete functional regression suite
        shell: bash
        run: bash scripts/ci/translationsub-full-regression.sh

      - name: Diagnostic log tails
        if: failure()
        shell: bash
        run: |
          set +e
          for file in /tmp/lampac-*.log /tmp/translationsub-*.log; do
            [ -f "$file" ] || continue
            echo "===== $file ====="
            tail -n 400 "$file"
          done
