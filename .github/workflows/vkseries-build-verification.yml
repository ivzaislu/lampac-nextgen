name: VkSeries build verification

on:
  push:
    branches:
      - vkseries-global-20260925
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}
      - run: dotnet build Modules/OnlineRUS/VkSeries/VkSeries.csproj --configuration Release --verbosity minimal
