name: VkSeries group season validation

on:
  push:
    branches:
      - vkseries-global-clean-20260925
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}
      - name: Validate exact-group season albums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/VkSeriesGroupValidation

          cat >.tmp/VkSeriesGroupValidation/Probe.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <OutputType>Exe</OutputType>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../Modules/OnlineRUS/VkSeries/VkSeries.csproj" />
            </ItemGroup>
          </Project>
          EOF

          cat >.tmp/VkSeriesGroupValidation/Program.cs <<'EOF'
          using System.Collections;
          using System.Reflection;
          using System.Text.Json;
          using Shared.Services.Utilities;
          using VkSeries;

          var t=typeof(VkSeriesController);
          var albumScoreM=t.GetMethod("AlbumScore",BindingFlags.Static|BindingFlags.NonPublic)!;
          var parseM=t.GetMethod("ParseVideos",BindingFlags.Static|BindingFlags.NonPublic)!;
          var groupScoreM=t.GetMethod("GroupIdentityScore",BindingFlags.Static|BindingFlags.NonPublic)!;

          int AlbumScore(VideoAlbum a,string title,short year)=>
              (int)(albumScoreM.Invoke(null,new object?[]{a,SearchNameTo.Convert(title)??"","",year})??0);

          int GroupScore(string group,string title)=>
              (int)(groupScoreM.Invoke(null,new object?[]{group,title,""})??0);

          List<(short season,short episode,Video video)> Parse(List<Video> videos,short hint)
          {
              var e=(IEnumerable?)parseM.Invoke(null,new object?[]{videos,hint})??Array.Empty<object>();
              var result=new List<(short,short,Video)>();
              foreach(var item in e)
              {
                  if(item is null)continue;
                  var it=item.GetType();
                  short s=(short)(it.GetProperty("season")?.GetValue(item)??(short)0);
                  short ep=(short)(it.GetProperty("episode")?.GetValue(item)??(short)0);
                  var v=(Video?)it.GetProperty("video")?.GetValue(item);
                  if(v!=null)result.Add((s,ep,v));
              }
              return result;
          }

          void Expect(string name,bool condition)
          {
              if(!condition)throw new Exception(name);
              Console.WriteLine("PASS "+name);
          }

          Expect("group exact Молодёжка",GroupScore("Молодёжка","Молодёжка")==1000);
          Expect("group exact Отель Элеон",GroupScore("Отель Элеон","Отель Элеон")==1000);
          Expect("group unrelated rejected",GroupScore("СТС","Молодёжка")==0);
          Expect("group suffix normalized",GroupScore("Интерны - новейший сериал про врачей.","Интерны")>=900);

          var cases=new[]{
              new {label="Молодёжка S3",title="Молодёжка",year=(short)2013,owner=-41781422L,album=55633364L,hint=(short)3},
              new {label="Отель Элеон S2",title="Отель Элеон",year=(short)2016,owner=-69110705L,album=13L,hint=(short)2},
              new {label="Физрук weak S2",title="Физрук",year=(short)2014,owner=-40580927L,album=4L,hint=(short)2}
          };

          using var http=new HttpClient{Timeout=TimeSpan.FromSeconds(30)};
          const int clientId=52461373;
          const string api="https://api.vkvideo.ru/method";
          const string ver="5.264";

          using var auth=JsonDocument.Parse(await Post($"{api}/auth.getAnonymToken?v={ver}&client_id={clientId}",new()));
          string token=auth.RootElement.GetProperty("response").GetProperty("token").GetString()!;

          foreach(var c in cases)
          {
              var albumInfo=new VideoAlbum{owner_id=c.owner,id=c.album,title=c.label,count=0};
              var vids=await Album(c.owner,c.album);
              var parsed=Parse(vids,c.hint)
                  .Where(x=>x.season==c.hint)
                  .ToList();
              var eps=parsed.Select(x=>x.episode).Distinct().OrderBy(x=>x).ToArray();
              bool noisy=parsed.Any(x=>{
                  var z=((x.video.title??"")+" "+(x.video.description??"")).ToLowerInvariant();
                  return z.Contains("трейлер")||z.Contains("тизер")||z.Contains("анонс")||
                         z.Contains("promo")||z.Contains("preview")||z.Contains("нарезк");
              });

              Console.WriteLine(JsonSerializer.Serialize(new{
                  kind="case",c.label,raw=vids.Count,episodes=eps.Length,
                  first=eps.Length>0?eps.First():0,last=eps.Length>0?eps.Last():0,
                  noisy,
                  samples=parsed.Take(5).Select(x=>x.video.title).ToArray()
              }));
          }

          // Negative album-title identities.
          Expect("Универ Новая общага is not plain Универ",
              AlbumScore(new VideoAlbum{title="Универ Новая Общага 1 Сезон",count=100},"Универ",2008)==0);
          Expect("Полицейский нарезка is not season album",
              AlbumScore(new VideoAlbum{title="Нарезка 3 сезона",count=40},"Полицейский с Рублёвки",2016)==0);

          async Task<List<Video>> Album(long owner,long album)
          {
              var result=new List<Video>();
              string json=await Post($"{api}/video.getFromAlbum?v={ver}&client_id={clientId}",new(){
                  ["access_token"]=token,["owner_id"]=owner.ToString(),["album_id"]=album.ToString(),
                  ["extended"]="1",["count"]="200",["offset"]="0"
              });
              var root=JsonSerializer.Deserialize<VideoFromAlbumRoot>(json,new JsonSerializerOptions{PropertyNameCaseInsensitive=true});
              foreach(var item in root?.response?.items??new())
              {
                  if(item?.video==null)continue;
                  item.video.playlist_position=item.playlist_position;
                  result.Add(item.video);
              }
              return result;
          }

          async Task<string> Post(string url,Dictionary<string,string> form)
          {
              using var res=await http.PostAsync(url,new FormUrlEncodedContent(form));
              return await res.Content.ReadAsStringAsync();
          }
          EOF

          dotnet run --project .tmp/VkSeriesGroupValidation/Probe.csproj --configuration Release
