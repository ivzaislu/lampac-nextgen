name: Bug report
description: Something broken in Lampac NextGen (module, install, Docker, playback…).
title: "<Component>: short description"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        RU or EN is fine. Good reports name the **component**, give **version + install type**, and include **steps or a curl/log** that reproduce the issue (see #235, #243, #245).

        Title tip: `GStreamer: …`, `JacRed: …`, `Kinogo: …`, `install.sh: …`

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where the bug shows up. Pick the closest match.
      options:
        - Online module (Alloha, Vibix, Kinogo, …)
        - Adult / NextHUB
        - JacRed / Torrents
        - TorrServer / Tracks
        - GStreamer / transcoding
        - DLNA
        - Sync / TimeCode / bookmarks
        - Chromium / Playwright / RCH
        - Lampa plugins (online.js, ts.js, …)
        - install.sh / update / scripts
        - Docker / umbrel / ansible
        - Admin / config / accsdb
        - Music
        - Security
        - Other / unknown
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: Module / path (if known)
      description: e.g. `Modules/OnlineRUS/Kinogo`, `Modules/GStreamer`, `install.sh`
      placeholder: Modules/...

  - type: input
    id: version
    attributes:
      label: Lampac version
      description: Tag, image digest, or `git rev-parse --short HEAD`
      placeholder: 1.61.1 / ghcr.io/lampac-nextgen/lampac:1.61.1
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - Docker (official image)
        - Native install.sh (Linux)
        - Windows
        - umbrel / other package
        - Built from source
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS / arch
      placeholder: linux/amd64, linux/arm64, Windows 11, …

  - type: input
    id: client
    attributes:
      label: Client
      description: Where you see the symptom
      placeholder: Lampa Android TV / WebOS / browser / curl

  - type: textarea
    id: problem
    attributes:
      label: What happens
      description: Observed behavior. One clear paragraph is enough.
      placeholder: e.g. `/lite/events` returns 500 when id and original_language=ja are both set.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
      placeholder: What should happen instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, or a minimal `curl` against `/lite/...` / `/gst/...`.
      placeholder: |
        1. …
        2. …
        ```bash
        curl -s "http://HOST:9118/lite/..."
        ```
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / response
      description: Relevant server log lines, HTTP status/body, or screenshot. Redact tokens and passwords.
      render: text

  - type: textarea
    id: config
    attributes:
      label: Relevant config (optional)
      description: Minimal `init.conf` / env snippet. Remove secrets (`token`, `apikey`, passwords).
      render: json

  - type: textarea
    id: extra
    attributes:
      label: Extra context (optional)
      description: Workarounds tried, related PRs, upstream links.
