{
  "listen": {
    "ip": "any",
    "port": 9118,
    "localhost": "127.0.0.1",
    "version": true,
    "ResponseCancelAfter": 120
  },
  "lowMemoryMode": true,
  "BaseModule": {
    "LoadModules": [
      "Online",
      "FlixCDN"
    ]
  },
  "chromium": {
    "enable": true,
    "Headless": true,
    "executablePath": "/usr/bin/chromium",
    "context": {
      "keepopen": true,
      "keepalive": 2,
      "min": 0,
      "max": 1
    }
  },
  "FlixCDN": {
    "enable": true
  }
}
